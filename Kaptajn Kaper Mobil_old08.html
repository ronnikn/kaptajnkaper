<title>Kaptajn Kaper Mobil</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Alegreya+Sans:wght@500;700;800&family=Pirata+One&family=VT323&display=swap">
<style>
/* Layout: a ship's log — scene on top, log card, helm controls in the thumb zone; two columns when wide */
:root{
  --ink:#08141f; --hull:#0e2232; --panel:#12293b; --panel-2:#183549;
  --line:rgba(214,170,84,.30); --brass:#d6aa54; --brass-dim:#9c7c3e;
  --paper:#efe6d0; --muted:#9fb2c0; --red:#c8283a; --red-deep:#8e1424; --good:#86c7a3; --warn:#e3a14a;
  --f-display:"Pirata One","Times New Roman",serif;
  --f-body:"Alegreya",Georgia,"Times New Roman",serif;
  --f-ui:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{
  margin:0;background:radial-gradient(120% 80% at 50% 0%,#10283a 0%,var(--ink) 60%) fixed,var(--ink);
  color:var(--paper);font-family:var(--f-body);font-size:16px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
#app{height:100%;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:8px;box-sizing:border-box}
#top{display:flex;align-items:center;gap:8px;flex:none;min-height:40px}
#top .brand{font-family:var(--f-display);font-size:22px;color:var(--brass);letter-spacing:.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .brand small{font-family:var(--f-body);font-style:italic;font-size:13px;color:var(--muted);margin-left:6px;letter-spacing:0}
.tbtn{font:600 13px var(--f-ui);color:var(--paper);background:transparent;border:1px solid var(--line);border-radius:999px;
  padding:7px 11px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;touch-action:manipulation;min-height:34px}
.tbtn:hover{border-color:var(--brass)}
.tbtn:disabled{opacity:.35;cursor:default}
.tbtn kbd,.btn kbd{font:700 10px var(--f-ui);color:var(--brass);border:1px solid var(--brass-dim);border-radius:4px;padding:1px 4px;line-height:1.3}
.tbtn.off{color:var(--muted)}
.tbtn svg{width:18px;height:18px;flex:none}
.tbtn .x{display:none}.tbtn.off .x{display:inline}.tbtn.off .w{display:none}
.tbtn.arm{background:var(--red-deep);border-color:#e6727f;color:#fff}
/* mobil: kortet fylder resten af skærmen i stående format */
body.mapmode #left{flex:1 1 auto;min-height:0}
body.mapmode #sceneWrap{flex:1 1 auto;aspect-ratio:auto;min-height:200px}
body.mapmode #right{flex:none}
body.mapmode #card{flex:none;max-height:92px;font-size:15px;line-height:1.32;padding:8px 12px}
body.mapmode #card .eyebrow{margin-bottom:2px}
/* hovedskærm (stående): Mål → logbog → overblik → kort → status nederst */
body.mapmode #left,body.mapmode #right,body.mapmode #hud,body.mapmode .hud{display:contents}
body.mapmode #top{order:0}
body.mapmode .hud .goal{order:1;margin-top:-4px;font-size:12.5px}
body.mapmode #card{order:2}
body.mapmode #controls{order:3}
body.mapmode #sceneWrap{order:4}
body.mapmode .hud .stats{order:5}
/* kanonkamp (stående): kamppanel øverst → kampbillede → knapper */
body.combatmode #left,body.combatmode #right,body.combatmode #hud{display:contents}
body.combatmode #top{order:0}
body.combatmode .cpanel{order:1}
body.combatmode #sceneWrap{order:2}
body.combatmode #card{order:3}
body.combatmode #controls{order:4;margin-top:auto}
body.combatmode .dwrap{aspect-ratio:16/10}
@media (max-height:720px) and (orientation:portrait){
  :where(html:not(.ffull)) body.combatmode .touchhint{display:none}
  :where(html:not(.ffull)) body.combatmode .aimrow{grid-template-columns:1fr}
  :where(html:not(.ffull)) body.combatmode .btn.fire{min-height:56px}
  :where(html:not(.ffull)) body.combatmode .wind svg{width:44px;height:44px}
  :where(html:not(.ffull)) body.combatmode .ctab{margin-top:2px} :where(html:not(.ffull)) body.combatmode .ctab td{font-size:13.5px}
}
/* øvrige sider med status (stående): Point/Mål øverst som på hovedsiden */
body.hudtop:not(.mapmode) #left,body.hudtop:not(.mapmode) #hud,body.hudtop:not(.mapmode) .hud{display:contents}
body.hudtop:not(.mapmode) #top{order:0}
body.hudtop:not(.mapmode) .hud .goal{order:1;margin-top:-4px;font-size:12.5px}
body.hudtop:not(.mapmode) #sceneWrap{order:2}
body.hudtop:not(.mapmode) .hud .stats{order:3}
body.hudtop:not(.mapmode) #right{order:4}
/* Point/Mål øverst på alle spilsider (stående) */
#goalbar{flex:none;order:0;margin-top:-4px}
body.mapmode #goalbar,body.combatmode #goalbar,body.hudtop #goalbar{order:1}
#goalbar .goal{font-size:12.5px}
.hud .goal{display:none}
/* inputfelter: fokusramme inden i feltet, så den ikke bliver skåret af i kanten */
form.inp input:focus-visible,.sl-row2 input:focus-visible{outline:none;border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
form.inp input.bad{border-color:#e6727f;box-shadow:inset 0 0 0 1px #e6727f;animation:nudge .3s}
@keyframes nudge{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.windwarn{display:flex;align-items:center;gap:12px;margin-top:4px;padding:10px 14px;border-radius:8px;background:rgba(214,170,84,.12);border:1px solid rgba(214,170,84,.55);font:600 15px var(--f-ui);color:var(--paper)}
.windwarn div{flex:1;text-align:center;line-height:1.25}.windwarn div span{color:var(--muted);font-weight:500;font-size:13px}
.windwarn b{color:var(--brass);font-size:17px;letter-spacing:.02em}
.windwarn .wa{font-size:34px;line-height:1;color:var(--brass);display:inline-block}
.windwarn.fromR .wa{animation:gustL 1.1s ease-in-out infinite}.windwarn.fromL .wa{animation:gustR 1.1s ease-in-out infinite}
@keyframes gustL{0%{transform:translateX(8px);opacity:.3}50%{opacity:1}100%{transform:translateX(-8px);opacity:.3}}
@keyframes gustR{0%{transform:translateX(-8px);opacity:.3}50%{opacity:1}100%{transform:translateX(8px);opacity:.3}}
.orignote{background:rgba(214,170,84,.1);border:1px solid rgba(214,170,84,.5);border-radius:8px;padding:9px 12px;font:500 13.5px/1.4 var(--f-ui);color:var(--muted)}
.orignote b{display:block;color:var(--brass);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px}
/* ---- originalgrafik fra 1985 ---- */
#y1985{cursor:default;-webkit-user-select:none;user-select:none;display:inline-block}
#y1985.blip{animation:blip .25s}
@keyframes blip{50%{color:var(--brass);transform:scale(1.15)}}
body.retro{background:#000;--paper:#fff;--muted:#55ffff;--brass:#ff55ff;--line:#fff;--f-display:'VT323',monospace;--f-body:'VT323',monospace;--f-ui:'VT323',monospace}
body.retro #card,body.retro #hud,body.retro #goalbar{display:none!important}
body.retro.mapmode #sceneWrap{aspect-ratio:auto;flex:1 1 auto}
body.retro.rstat #sceneWrap{aspect-ratio:1.13}
@media (min-width:860px) and (min-aspect-ratio:5/4), (max-height:520px) and (orientation:landscape){
  :where(html:not(.fmob)) body.retro #app{display:flex;flex-direction:column;align-items:center;gap:10px}
  :where(html:not(.fmob)) body.retro #top{align-self:stretch}
  :where(html:not(.fmob)) body.retro #left{width:auto;height:calc(100dvh - 76px);aspect-ratio:4/3;max-width:100%;overflow:visible;flex:none}
  :where(html:not(.fmob)) body.retro.ctlinput #left{height:calc(100dvh - 150px)}
  :where(html:not(.fmob)) body.retro #sceneWrap,:where(html:not(.fmob)) body.retro.mapmode #sceneWrap{aspect-ratio:4/3;width:100%;height:auto;flex:none}
  :where(html:not(.fmob)) body.retro #right,:where(html:not(.fmob)) body.retro.mapmode #right{display:none!important}
  :where(html:not(.fmob)) body.retro.ctlinput #right{display:flex!important;width:min(560px,100%);flex:none}
  :where(html:not(.fmob)) body.retro.mapmode #left{display:block!important}
}
/* tvunget fuld visning */

  :where(html.ffull) body.retro #app{display:flex;flex-direction:column;align-items:center;gap:10px}
  :where(html.ffull) body.retro #top{align-self:stretch}
  :where(html.ffull) body.retro #left{width:auto;height:calc(100dvh - 76px);aspect-ratio:4/3;max-width:100%;overflow:visible;flex:none}
  :where(html.ffull) body.retro.ctlinput #left{height:calc(100dvh - 150px)}
  :where(html.ffull) body.retro #sceneWrap,:where(html.ffull) body.retro.mapmode #sceneWrap{aspect-ratio:4/3;width:100%;height:auto;flex:none}
  :where(html.ffull) body.retro #right,:where(html.ffull) body.retro.mapmode #right{display:none!important}
  :where(html.ffull) body.retro.ctlinput #right{display:flex!important;width:min(560px,100%);flex:none}
  :where(html.ffull) body.retro.mapmode #left{display:block!important}

body.retro.mapmode #controls{order:5}
body.retro .btn.ov{font-size:20px}
body.retro .btn.ov.on{background:#55ffff;color:#000}
body.retro #sceneWrap{aspect-ratio:4/3;border-radius:0;box-shadow:0 0 0 3px #333,0 0 0 6px #111;background:#1030c8}
body.retro #scene{image-rendering:pixelated}
body.retro #toast,body.retro #toast.cap{font:400 20px 'VT323',monospace;border-radius:0;background:#000;color:#55ffff;border:2px solid #55ffff;text-transform:none;letter-spacing:0}
body.retro #controls{gap:6px}
body.retro .btn{font:400 22px 'VT323',monospace;background:#1030c8;border:2px solid #fff;border-radius:0;color:#fff;min-height:46px;letter-spacing:.02em}
body.retro .btn.primary{background:#aa0000;border-color:#ff5555}
body.retro .btn.gold{background:#55ffff;color:#000;border-color:#fff}
body.retro .hint,body.retro .maprow .hint,body.retro .touchhint p{font:400 18px 'VT323',monospace;color:#55ffff}
body.retro .touchhint{background:#000;border:2px dashed #55ffff;border-radius:0}
body.retro form.slider,body.retro form.inp input,body.retro .sl-row2 input{background:#000;border:2px solid #fff;border-radius:0;font-family:'VT323',monospace;font-size:22px;color:#fff}
body.retro .sl-top{font:400 20px 'VT323',monospace}
body.retro #top .brand{font-family:'VT323',monospace;color:#55ffff;font-size:26px}
body.retro #top .brand small{font-family:'VT323',monospace;color:#fff}
body.retro .tbtn{font:400 18px 'VT323',monospace;border-radius:0;border:2px solid #fff;color:#fff}
#bRetro span{font:400 18px 'VT323',monospace;letter-spacing:.04em}
body:not(.retro) #bRetro{border-color:#ff55ff;color:#ff55ff}
#dosEgg{position:fixed;inset:0;z-index:60;background:#000;display:flex;align-items:center;justify-content:center;padding:20px}
#dosEgg .dosbox{width:100%;max-width:520px}
#dosEgg pre{font:400 22px/1.25 'VT323',monospace;color:#aaaaaa;margin:0 0 18px;white-space:pre-wrap;min-height:9em}
.dosbtns{display:grid;gap:10px}
.dosbtn{font:400 24px 'VT323',monospace;background:#1030c8;color:#fff;border:2px solid #fff;padding:12px;cursor:pointer}
.dosbtn.alt{background:#000;color:#aaaaaa;border-color:#aaaaaa}
.dosbtns p{font:400 18px 'VT323',monospace;color:#55ffff;margin:4px 0 0;text-align:center}
.maprow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.maprow .hint{text-align:left;font-size:12.5px;line-height:1.3}
.btn.ov{min-height:44px;padding:6px 14px;font-size:14px}
#bLayout.ovfull{position:absolute;top:10px;right:10px;z-index:4;display:none;min-height:36px;padding:6px 12px;width:auto}
body.ovon:not(.lwide) #bLayout.ovfull{display:block}
body.lwide #bLay .ls,body:not(.lwide) #bLay .pt,body.lwide #bLay .lt-full,body:not(.lwide) #bLay .lt-mob{display:none}
body:not(.lwide) .tbtn .tl{display:none}
/* 1985 på mobil: "Tryk for at fortsætte" står nederst, og hele det sorte felt kan trykkes */
body.retro.anymode:not(.lwide) #controls{flex:1 1 auto;display:flex;flex-direction:column;cursor:pointer}
body.retro.anymode:not(.lwide) #controls .hint{margin-top:auto;padding:12px 0 6px}   /* mobil: kun ikoner i toppen, så der er plads */
body.lwide #bOv{display:none!important} body.lwide .maprow{grid-template-columns:1fr}
html.ffull #top{min-width:0} html.ffull .tbtn{flex:none}
@media (max-width:900px){ html.ffull #app{grid-template-columns:minmax(0,1fr) auto} }
.btn.ov.on{background:linear-gradient(180deg,#e1b862,#a67d2c);color:#1d1407;border-color:#f0d08a}
.lr .btn{min-height:72px;font-size:19px}
.lr .btn svg{width:26px;height:26px}
#left{display:flex;flex-direction:column;gap:10px;flex:none}
#sceneWrap{flex:none;position:relative;width:100%;aspect-ratio:16/10;max-width:100%;border-radius:8px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(214,170,84,.35),0 12px 30px rgba(0,0,0,.45);background:#0b1a27}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#toast{position:absolute;left:50%;top:12px;transform:translate(-50%,-6px);opacity:0;transition:opacity .2s,transform .2s;
  font:700 13px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;background:rgba(142,20,36,.92);color:#fff;
  padding:5px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.cap{background:rgba(8,20,31,.86);border:1px solid rgba(214,170,84,.6);font:italic 500 16px var(--f-body);letter-spacing:0;text-transform:none;color:var(--paper);padding:6px 16px}
#right{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:auto}
#card{flex:1 1 auto;min-height:0;overflow:auto;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));
  border:1px solid var(--line);border-radius:8px;padding:12px 14px;line-height:1.38;font-size:16.5px}
#card:empty{display:none}
#card .eyebrow{font:700 11px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--brass);margin-bottom:4px}
#card h2{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.05;margin:0 0 6px;color:var(--paper);text-wrap:balance}
#card h2.big{font-size:40px}
#card p{margin:0 0 6px}
#card p:last-child{margin-bottom:0}
#card .gap{height:6px}
#card .sub{color:var(--muted);font-style:italic}
#card .err{color:#ff8f8f;font-weight:700}
#card .tribute{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:15px;line-height:1.42}
#card .tribute p{margin:0 0 7px}
#card .small{font-size:13px}
#card .em{color:var(--brass);font-weight:700}
#card .num{font-family:var(--f-ui);font-weight:800;font-variant-numeric:tabular-nums}
#card table{border-collapse:collapse;font-family:var(--f-ui);font-variant-numeric:tabular-nums;margin-top:4px}
#card td,#card th{padding:3px 14px 3px 0;text-align:left}
#card th{font:700 11px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#hud{flex:none}
#hud:empty{display:none}
.hud{display:grid;gap:6px}
.goal{display:grid;grid-template-columns:1fr 1fr;gap:10px;font:500 13px var(--f-ui);color:var(--muted)}
.goal b{color:var(--paper);font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.bar{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--brass);border-radius:2px;transition:width .3s}
.bar.t i{background:#7aa6c2}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.stat{background:var(--panel);border:1px solid rgba(214,170,84,.16);border-radius:6px;padding:5px 4px 4px;text-align:center;min-width:0}
.stat span{display:block;font:700 9.5px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font:800 16px var(--f-ui);font-variant-numeric:tabular-nums;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.bad{border-color:rgba(200,40,58,.7);background:rgba(142,20,36,.35)}
.stat.warn{border-color:rgba(227,161,74,.6)}
.stat.flash{animation:fl .6s}
@keyframes fl{0%,100%{}30%{background:var(--red)}}
/* combat panel */
.cpanel{display:grid;grid-template-columns:1.15fr .85fr;gap:8px}
.cbox{background:var(--panel);border:1px solid rgba(214,170,84,.18);border-radius:6px;padding:6px;min-width:0}
.cbox .lbl{font:700 9.5px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.dwrap{position:relative;width:100%;aspect-ratio:14/10;margin-top:4px;border-radius:4px;overflow:hidden}
.dwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.wind{display:flex;gap:8px;align-items:center;margin-top:4px}
.wind svg{width:58px;height:58px;flex:none}
.wind dl{margin:0;display:grid;gap:2px;font:500 12px var(--f-ui);color:var(--muted)}
.wind dd{margin:0;font:800 17px var(--f-ui);color:var(--paper);font-variant-numeric:tabular-nums}
.ctab{width:100%;border-collapse:collapse;font:500 13px var(--f-ui);font-variant-numeric:tabular-nums;margin-top:6px}
.ctab th{font:700 9.5px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:right;padding:2px 2px}
.ctab th:first-child{text-align:left}
.ctab td{text-align:right;padding:2px 2px;font-weight:800;font-size:15px}
.ctab td:first-child{text-align:left;color:var(--muted);font-weight:500;font-size:12.5px}
.ctab .own{color:#bfe0f0}.ctab .foe{color:#f4b3b3}
/* controls */
#controls{flex:none;display:flex;flex-direction:column;gap:8px;padding-bottom:2px}
#controls:empty{display:none}
#controls.busy{opacity:.45;pointer-events:none;filter:saturate(.6);transition:opacity .15s}
.btn{font:700 15px var(--f-ui);color:var(--paper);background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid rgba(214,170,84,.45);border-radius:8px;min-height:48px;padding:8px 12px;cursor:pointer;touch-action:manipulation;
  display:flex;align-items:center;justify-content:center;gap:8px;text-align:left;user-select:none;-webkit-user-select:none}
.btn:hover{border-color:var(--brass)}
.btn:active{transform:translateY(1px);filter:brightness(1.15)}
.btn:focus-visible,.tbtn:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn.primary{background:linear-gradient(180deg,#d33a4b,var(--red-deep));border-color:#e6727f}
.btn.gold{background:linear-gradient(180deg,#e1b862,#a67d2c);color:#1d1407;border-color:#f0d08a}
.btn.gold kbd{color:#1d1407;border-color:#5a4316}
.row{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.hint{margin:0;text-align:center;font:500 12.5px var(--f-ui);color:var(--muted)}
.menu{display:grid;gap:6px}
.menu .btn{justify-content:flex-start;min-height:44px}
.menu .btn .p{margin-left:auto;font-weight:500;color:var(--muted);font-size:13px;white-space:nowrap}
/* havnemenu på mobil (ny grafik): to kolonner med prisen under navnet, så logbogen har plads */
body:not(.lwide):not(.retro) .menu.havn{grid-template-columns:1fr 1fr}
body:not(.lwide):not(.retro) .menu.havn .btn{flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:52px;padding:6px 12px;text-align:left}
body:not(.lwide):not(.retro) .menu.havn .btn .p{margin-left:0;font-size:12px}
.helm{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:6px}
.pad .btn{min-height:0;padding:0;border-radius:10px}
.pad .btn svg{width:22px;height:22px}

/* ---------- lyd: PLAY (MML) og SOUND gennem WebAudio ---------- */
let AC = null, master = null, cursor = 0, noiseBuf = null;
const MML = {T:120, L:4, O:4, art:7/8};
function ensureAudio(){
  if(!AC){
    try{
      AC = new (window.AudioContext||window.webkitAudioContext)();
      const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3200;
      master = AC.createGain(); master.gain.value = S.LYD ? 1 : 0;
      master.connect(lp); lp.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate*1.2, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }catch(e){ AC = null; }
  }
  if(AC && AC.state==='suspended') AC.resume();
}
function setLyd(v){
  S.LYD = v;
  if(master){ master.gain.cancelScheduledValues(AC.currentTime); master.gain.setValueAtTime(v?1:0, AC.currentTime); }
  if(!v) cursor = 0;
  const b = $('#bSound'); b.classList.toggle('off', !v); b.querySelector('.tl').textContent = v ? 'Lyd til' : 'Lyd fra';
}
function tone(f, t, dur, type='square', g=0.045, dest){
  if(!AC || f<=0 || dur<=0) return;
  const o = AC.createOscillator(), a = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(g, t+0.006);
  a.gain.setValueAtTime(g, Math.max(t+0.006, t+dur-0.012)); a.gain.linearRampToValueAtTime(0, t+dur);
  o.connect(a); a.connect(dest||master); o.start(t); o.stop(t+dur+0.02);
}
function play(str){
  if(!S.LYD) return; ensureAudio(); if(!AC) return;
  const s = str.toUpperCase(); let i = 0;
  let tm = Math.max(AC.currentTime+0.03, cursor);
  const num = () => { const m = /^\d+/.exec(s.slice(i)); if(m){ i += m[0].length; return +m[0]; } return null; };
  const dots = () => { let d=0; while(s[i]==='.'){ d++; i++; } return d; };
  const len = (n,d) => { let L=(4/n)*(60/MML.T), a=L; for(let k=0;k<d;k++){ a/=2; L+=a; } return L; };
  const semis = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  while(i < s.length){
    const ch = s[i++];
    if(ch==='T'){ const n=num(); if(n) MML.T=n; }
    else if(ch==='L'){ const n=num(); if(n) MML.L=n; }
    else if(ch==='O'){ const n=num(); if(n!==null) MML.O=Math.min(6,n); }
    else if(ch==='<') MML.O=Math.max(0,MML.O-1);
    else if(ch==='>') MML.O=Math.min(6,MML.O+1);
    else if(ch==='M'){ const m=s[i++]; if(m==='N') MML.art=7/8; else if(m==='L') MML.art=1; else if(m==='S') MML.art=3/4; }
    else if(ch==='P'){ const n=num()||MML.L; tm += len(n, dots()); }
    else if(semis[ch]!==undefined){
      let st = semis[ch];
      if(s[i]==='#'||s[i]==='+'){ st++; i++; } else if(s[i]==='-'){ st--; i++; }
      const n = num(); const L = len(n||MML.L, dots());
      tone(440*Math.pow(2, ((MML.O-3)*12+st-9)/12), tm, L*MML.art, 'square', 0.04);
      tone(440*Math.pow(2, ((MML.O-3)*12+st-9)/12), tm, L*MML.art, 'triangle', 0.05);
      tm += L;
    }
  }
  cursor = tm;
}
function sweep(f0, f1, dur, type='square', g=0.05, delay=0){
  if(!S.LYD) return; ensureAudio(); if(!AC) return;
  const t = AC.currentTime+0.01+delay, o = AC.createOscillator(), a = AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t+dur);
  a.gain.setValueAtTime(g,t); a.gain.linearRampToValueAtTime(0, t+dur);
  o.connect(a); a.connect(master); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur, freq=900, g=0.25, type='bandpass', delay=0){
  if(!S.LYD) return; ensureAudio(); if(!AC||!noiseBuf) return;
  const t = AC.currentTime+0.01+delay, src = AC.createBufferSource(), f = AC.createBiquadFilter(), a = AC.createGain();
  src.buffer = noiseBuf; f.type=type; f.frequency.value=freq; f.Q.value=0.8;
  a.gain.setValueAtTime(g,t); a.gain.exponentialRampToValueAtTime(0.001, t+dur);
  src.connect(f); f.connect(a); a.connect(master); src.start(t); src.stop(t+dur+0.05);
}

/* ---------- tastatur / knapper ---------- */
class KeyQ {
  constructor(){ this.q=[]; this.w=null; }
  push(k){ if(this.w){ const w=this.w; this.w=null; w(k); } else this.q.push(k); }
  wait(){ return this.q.length ? Promise.resolve(this.q.shift()) : new Promise(r => this.w = r); }
  take(){ return this.q.length ? this.q.shift() : ''; }
  clear(){ this.q.length = 0; }
}
const gameKeys = new KeyQ(), helpKeys = new KeyQ();
const waitKey = () => gameKeys.wait();
const inkey = () => gameKeys.take();
const clearKeys = () => gameKeys.clear();
function pushKey(k){ if(helpOpen) helpKeys.push(k); else gameKeys.push(k); }
const KEYMAP = {ArrowLeft:'4',ArrowRight:'6',ArrowUp:'8',ArrowDown:'2',Home:'7',PageUp:'9',End:'1',PageDown:'3',Enter:'\r',Escape:'Escape'};
/* piletaster: to pile samtidig (fx op+venstre) giver diagonal, som 7/9/1/3 på numpad */
const held = new Set(); let arrowT = 0, arrowSeen = new Set();
function flushArrows(){
  arrowT = 0; const s = arrowSeen; arrowSeen = new Set();
  const dx = (s.has('ArrowRight')?1:0)-(s.has('ArrowLeft')?1:0), dy = (s.has('ArrowDown')?1:0)-(s.has('ArrowUp')?1:0);
  const k = {'-1,-1':'7','0,-1':'8','1,-1':'9','-1,0':'4','1,0':'6','-1,1':'1','0,1':'2','1,1':'3'}[dx+','+dy];
  if(k) pushKey(k);
}
addEventListener('keyup', e => held.delete(e.key));
addEventListener('keydown', e => {
  ensureAudio();
  if(e.key==='F1'){ e.preventDefault(); openHelp(); return; }
  if(e.key==='F2'){ e.preventDefault(); setLyd(!S.LYD); return; }
  if(RIN && !e.ctrlKey && !e.metaKey && !e.altKey){ e.preventDefault();
    if(e.key==='Enter'){ const r=RIN; if(r.onEnter(r.buf)){ if(RIN===r) RIN=null; ctl(''); clearKeys(); } }
    else if(e.key==='Backspace') RIN.buf=RIN.buf.slice(0,-1);
    else if(e.key.length===1 && RIN.buf.length<RIN.max) RIN.buf+=e.key;
    return; }
  if(e.target && e.target.tagName==='INPUT') return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key.startsWith('Arrow') && !helpOpen && (ctlMode==='map'||ctlMode==='aim')){
    e.preventDefault(); held.add(e.key);
    held.forEach(h => arrowSeen.add(h));
    if(!arrowT) arrowT = setTimeout(flushArrows, 60);
    return;
  }
  const k = KEYMAP[e.key] ?? (e.key.length===1 ? e.key : null);
  if(k!==null){ if(e.key.startsWith('Arrow')||e.key===' ') e.preventDefault(); pushKey(k); }
});

/* pause-bevidst ventetid (spillet står stille mens hjælpen er åben, som ON KEY(1) GOSUB) */
function sleep(ms){
  return new Promise(res => { let left = ms, last = now();
    (function tick(){ const n = now(); if(!helpOpen) left -= n-last; last = n; if(left<=0) res(); else setTimeout(tick, Math.min(left, 40)); })(); });
}

let RIN=null;
const rInputWide = () => RETRO.on && LANDQ.matches && matchMedia('(hover:hover) and (pointer:fine)').matches;   // kun med rigtigt tastatur/mus (ikke tablet)
function rInput(max, onEnter){ clearKeys(); ctl('', 'rinput'); RIN={buf:'', max, onEnter}; }
function inputText(label, {numeric=false, max=40, required=false}={}){

    ctl(`<form class="inp" autocomplete="off"><input id="inp" ${numeric?'inputmode="numeric"':''} maxlength="${max}" aria-label="${esc(label)}" placeholder="${esc(label)}"><button class="btn gold" type="submit">OK</button></form>`, 'input');

      if(required && !v.trim()){ inp.classList.remove('bad'); void inp.offsetWidth; inp.classList.add('bad'); inp.placeholder='Skriv dit navn for at fortsætte'; beep(); inp.focus(); return; }
      ctl(''); clearKeys(); res(v); });

/* INPUT til heltalsvariabel — med skyder. Værdien kan stadig skrives; ugyldigt tal giver "?Redo from start". */
function inputNum(label, before, {max=0, price=0, unit=''}={}){
  max = Math.max(0, Math.min(32767, fl(max)));
  if(rInputWide()) return new Promise(res => rInput(7, v => { v=v.trim(); if(v===''){ res(0); return true; }
    const n=Number(v.replace(',','.')); if(Number.isFinite(n) && Math.abs(n)<=32767){ res(cint(n)); return true; } beep(); RIN.buf=''; return false; }));
  return new Promise(res => {
    clearKeys();
    const step = max>200 ? 1 : 1;
    ctl(`<form class="slider" autocomplete="off">
      <div class="sl-top"><label for="sl">${esc(label)}?</label><output id="sltot"></output></div>
      <div class="sl-row"><button type="button" class="btn sm" data-d="-1" aria-label="Én mindre">−</button>
        <input type="range" id="sl" min="0" max="${max}" step="${step}" value="0">
        <button type="button" class="btn sm" data-d="1" aria-label="Én mere">+</button></div>
      <div class="sl-row2"><input id="inp" inputmode="numeric" maxlength="7" value="0" aria-label="Antal">
        <button type="button" class="btn sm" data-q="0">0</button><button type="button" class="btn sm" data-q="0.5">½</button><button type="button" class="btn sm" data-q="1">Maks ${max}</button>
        <button class="btn gold" type="submit">OK</button></div></form>`, 'input');
    const f = ctlEl.querySelector('form'), sl = f.querySelector('#sl'), inp = f.querySelector('#inp'), tot = f.querySelector('#sltot');
    const show = () => { const n = Number(inp.value.replace(',','.')); tot.textContent = Number.isFinite(n) && price ? `${n} ${unit} = ${fmtP(n*price)} rgsd` : ''; };
    const setV = v => { v = Math.max(0, Math.min(max, Math.round(v))); sl.value = v; inp.value = v; show(); };
    sl.addEventListener('input', () => { inp.value = sl.value; show(); });
    inp.addEventListener('input', () => { const n=Number(inp.value.replace(',','.')); if(Number.isFinite(n)) sl.value=Math.max(0,Math.min(max,n)); show(); });
    f.addEventListener('click', e => { const b=e.target.closest('button[type=button]'); if(!b) return;
      if(b.dataset.d) setV(Number(sl.value)+Number(b.dataset.d)); else setV(max*Number(b.dataset.q)); });
    show();
    f.addEventListener('submit', e => { e.preventDefault();
      const v = inp.value.trim(); if(v===''){ ctl(''); return res(0); }
      const n = Number(v.replace(',', '.'));
      if(Number.isFinite(n) && Math.abs(n) <= 32767){ ctl(''); clearKeys(); return res(cint(n)); }
      card(before + P(['<span class="err">?Redo from start</span>'])); inp.select();
    });
  });
}
const fmtP = p => Number.isInteger(p) ? String(p) : p.toFixed(2).replace('.',',');

/* ---------- logbogen som rorpad: tryk i kanter/hjørner = 8 retninger ---------- */
const PADDIR = {'-1,-1':'7','0,-1':'8','1,-1':'9','-1,0':'4','1,0':'6','-1,1':'1','0,1':'2','1,1':'3'};
let padStart = null;
cardEl.addEventListener('pointerdown', e => { if(ctlMode!=='map' || !cardEl.classList.contains('steer')) return; padStart = {x:e.clientX, y:e.clientY}; });
cardEl.addEventListener('pointerup', e => {
  const st = padStart; padStart = null; if(!st || ctlMode!=='map' || helpOpen) return;
  const dx = e.clientX-st.x, dy = e.clientY-st.y; let k;
  if(Math.hypot(dx,dy) > 28) k = dir8(dx,dy);
  else { const r = cardEl.getBoundingClientRect(); const fx = (e.clientX-r.left)/r.width, fy = (e.clientY-r.top)/r.height;
    const zx = fx<1/3?-1:fx>2/3?1:0, zy = fy<1/3?-1:fy>2/3?1:0; k = PADDIR[zx+','+zy]; }
  if(!k) return;
  pushKey(k);
  const el = cardEl.querySelector(`.steerpad i[data-k="${k}"]`); if(el){ el.classList.remove('on'); void el.offsetWidth; el.classList.add('on'); }
});

/* ---------- touch på spilskærmen ---------- */
let touchStart = null, lastAim = '';
function sceneXY(e){ const r = $('#scene').getBoundingClientRect(); return [(e.clientX-r.left)/r.width*320, (e.clientY-r.top)/r.height*200]; }
function dir8(dx, dy){ const a = Math.atan2(dy, dx), s = Math.round(a/(Math.PI/4)); return {'0':'6','1':'3','2':'2','3':'1','4':'4','-4':'4','-3':'7','-2':'8','-1':'9'}[s]; }
function aimFrom(e){ const [x,y] = sceneXY(e); const k = RETRO.on ? 'aim:'+Math.round(x-230)+','+Math.round(y-50) : 'aim:'+Math.round(150+x/2-230)+','+Math.round(y/2-50); if(k!==lastAim){ lastAim=k; pushKey(k); } }
const scEl = $('#scene');
scEl.addEventListener('pointerdown', e => {
  touchStart = {x:e.clientX, y:e.clientY, xy:sceneXY(e)};
  touchStart.opt = rOptAt(touchStart.xy);
  if(ctlMode==='aim' && !touchStart.opt){ try{ scEl.setPointerCapture(e.pointerId); }catch(_){} aimFrom(e); }
});
scEl.addEventListener('pointermove', e => { if(touchStart && !touchStart.opt && ctlMode==='aim') aimFrom(e); scEl.style.cursor = (RETRO.on && rOptAt(sceneXY(e))) ? 'pointer' : ''; });
scEl.addEventListener('pointerup', e => {
  const st = touchStart; touchStart = null; if(!st) return;
  if(helpOpen){ if(RHELP && st.opt) helpKeys.push(st.opt.key); return; }
  const dx = e.clientX-st.x, dy = e.clientY-st.y, swipe = Math.hypot(dx,dy) > 28;
  if(V.mode==='end' && V.E){ endTap(st.xy[0], st.xy[1]); return; }   // slutskærmen: tryk på billedet fortsætter ikke (påskeæg)
  if(st.opt){ pushKey(st.opt.key); return; }                                   // originalgrafik: valg trykket direkte i teksten
  if(RETRO.on && (ctlMode==='choice'||ctlMode==='menu')) return;
  if(ctlMode==='any'){ pushKey(' '); return; }
  if(ctlMode==='aim'){ aimFrom(e); return; }
  if(ctlMode==='lr'){
    if(swipe && Math.abs(dx)>Math.abs(dy)) pushKey(dx<0?'4':'6');
    else if(!swipe) pushKey(st.xy[0] < 160 ? '4' : '6');
    else pushKey(' ');
    return;
  }
  if(ctlMode==='map'){
    if(V.overview){ V.overview=false; const b=$('#bOv'); if(b) b.classList.remove('on'); return; }
    if(swipe){ pushKey(dir8(dx,dy)); return; }
    // tryk: én retning fra skibet mod det sted man trykkede
    const r = scEl.getBoundingClientRect(); let mx = (st.x-r.left-VIEW.ox)/VIEW.s, my = (st.y-r.top-VIEW.oy)/VIEW.s;
    if(RETRO.on){ if(V.overview && RETRO.on){ V.overview=false; const b=$('#bOv'); if(b) b.classList.remove('on'); return; } if(R_VIEW){ const lx=(st.x-r.left), ox=R_VIEW.sy?(r.width-320*R_VIEW.s)/2:0; mx=R_VIEW.x0+(lx-ox)/R_VIEW.s; my=R_VIEW.y0+(st.y-r.top-R_VIEW.top)/(R_VIEW.sy||R_VIEW.s); } else { mx=st.xy[0]; my=st.xy[1]; } mx-=0; }   // originalgrafik
    const ddx = mx-(S.IX+5.5), ddy = my-(S.IY+5.5);
    if(Math.hypot(ddx,ddy) < 5) return;
    pushKey(dir8(ddx, ddy)); V.tapAt = now(); V.tapXY=[mx,my];
  }
});

function fit(c){ const r=c.getBoundingClientRect(); const d=Math.min(window.devicePixelRatio||1, 2.5);
  const w=Math.max(1,Math.round(r.width*d)), h=Math.max(1,Math.round(r.height*d)); if(c.width!==w||c.height!==h){ c.width=w; c.height=h; } }
function mulberry(a){ return () => { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- flag ---------- */
function flagFace(c, kind, x, y, w, h){
  if(kind==='dk'){
    c.fillStyle='#c8102e'; c.fillRect(x,y,w,h); const u=h/7; c.fillStyle='#fff';
    c.fillRect(x+3*u, y, u, h); c.fillRect(x, y+3*u, w, u);
  } else if(kind==='uk'){
    c.fillStyle='#1d3474'; c.fillRect(x,y,w,h); c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
    const L=(lw,col,a,b,cc,d)=>{ c.strokeStyle=col; c.lineWidth=lw; c.beginPath(); c.moveTo(a,b); c.lineTo(cc,d); c.stroke(); };
    L(h*.24,'#fff',x,y,x+w,y+h); L(h*.24,'#fff',x+w,y,x,y+h);
    L(h*.08,'#c8102e',x,y,x+w,y+h); L(h*.08,'#c8102e',x+w,y,x,y+h);
    L(h*.34,'#fff',x+w/2,y,x+w/2,y+h); L(h*.34,'#fff',x,y+h/2,x+w,y+h/2);
    L(h*.2,'#c8102e',x+w/2,y,x+w/2,y+h); L(h*.2,'#c8102e',x,y+h/2,x+w,y+h/2);
    c.restore();
  } else if(kind==='jolly'){
    c.fillStyle='#111'; c.fillRect(x,y,w,h); c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
    c.strokeStyle='#eee'; c.lineWidth=h*.09; c.lineCap='round';
    c.beginPath(); c.moveTo(x+w*.3,y+h*.55); c.lineTo(x+w*.7,y+h*.9); c.moveTo(x+w*.7,y+h*.55); c.lineTo(x+w*.3,y+h*.9); c.stroke();
    c.fillStyle='#eee'; c.beginPath(); c.arc(x+w*.5,y+h*.36,h*.22,0,7); c.fill(); c.fillRect(x+w*.43,y+h*.45,w*.14,h*.18);
    c.fillStyle='#111'; c.beginPath(); c.arc(x+w*.44,y+h*.34,h*.06,0,7); c.arc(x+w*.56,y+h*.34,h*.06,0,7); c.fill();
    c.restore();
  }
}
function flag(c, kind, x, y, w, h, t, amp=1){
  if(!kind) return;
  c.save(); c.beginPath(); const N=8;
  for(let i=0;i<=N;i++){ const px=x+w*i/N, py=y+Math.sin(t*5+i*0.9)*h*0.09*amp*(i/N); i?c.lineTo(px,py):c.moveTo(px,py); }
  for(let i=N;i>=0;i--){ const px=x+w*i/N, py=y+h+Math.sin(t*5+i*0.9)*h*0.09*amp*(i/N); c.lineTo(px,py); }
  c.closePath(); c.clip(); flagFace(c, kind, x, y-h*.1, w, h*1.2);
  const g=c.createLinearGradient(x,0,x+w,0);
  for(let i=0;i<=4;i++){ g.addColorStop(i/4, `rgba(0,0,0,${0.12+0.12*Math.sin(t*5+i*1.8)})`); }
  c.fillStyle=g; c.fillRect(x,y-h,w,h*3); c.restore();
}

/* ---------- sideskib (bov mod venstre i egne koordinater; vandlinje y=0, længde ~100) ---------- */
function drawShip(c, o){
  const t=o.t||0, small=o.s<0.3;
  c.save(); c.translate(o.x,o.y); if(o.heel) c.rotate(o.heel); c.scale(o.flip?-o.s:o.s, o.s);
  const M = o.masts===3 ? [[-20,66],[3,76],[25,56]] : [[-10,60],[16,52]];
  const mastCol='#3a2716';
  c.lineCap='round';
  c.strokeStyle=mastCol; c.lineWidth=small?3:2;
  c.beginPath(); c.moveTo(-44,-10); c.lineTo(-68,-22); c.stroke();
  // stag og vant
  if(!small){ c.strokeStyle='rgba(30,20,10,.55)'; c.lineWidth=.6; c.beginPath();
    c.moveTo(-68,-22); c.lineTo(M[0][0],-10-M[0][1]);
    for(let i=0;i<M.length-1;i++){ c.moveTo(M[i][0],-10-M[i][1]); c.lineTo(M[i+1][0],-10-M[i+1][1]*0.75); }
    c.moveTo(M[M.length-1][0],-10-M[M.length-1][1]); c.lineTo(46,-16); c.stroke(); }
  c.strokeStyle=mastCol; c.lineWidth=small?3.2:2.4;
  for(const [mx,h] of M){ c.beginPath(); c.moveTo(mx,-10); c.lineTo(mx,-10-h); c.stroke(); }
  // forsejl
  const sailG = c.createLinearGradient(0,-80,0,-10); sailG.addColorStop(0,'#fbf5e6'); sailG.addColorStop(1,'#d8cbab');
  if(o.sails!=='furled'){
    c.fillStyle=sailG; c.strokeStyle='rgba(60,45,25,.35)'; c.lineWidth=.7;
    c.beginPath(); c.moveTo(M[0][0]-1,-10-M[0][1]*0.92); c.quadraticCurveTo(-48,-36,-64,-21); c.lineTo(-40,-13); c.closePath(); c.fill(); if(!small) c.stroke();
  }
  // råsejl
  M.forEach(([mx,h],idx) => {
    const last = idx===M.length-1 && M.length===3;
    if(o.sails==='furled'){
      c.strokeStyle='#d9ccb0'; c.lineWidth=2.4;
      [0.35,0.62,0.85].forEach((k,j)=>{ const y=-10-h*k, w=15-j*3; c.beginPath(); c.moveTo(mx-w,y); c.lineTo(mx+w,y); c.stroke(); });

    }
    if(last){   // mesansejl
      c.fillStyle=sailG; c.beginPath(); c.moveTo(mx+1,-15); c.lineTo(mx+1,-10-h*.8); c.lineTo(mx+20,-10-h*.6); c.quadraticCurveTo(mx+26,-30,mx+25,-15); c.closePath(); c.fill(); if(!small) c.stroke();
      return;
    }
    const tiers = small ? [[0.06,0.48,13],[0.52,0.9,10]] : [[0.06,0.36,15],[0.39,0.66,12.5],[0.69,0.9,9]];
    if(o.battleSails){ tiers.shift(); c.strokeStyle='#d9ccb0'; c.lineWidth=2.4; c.beginPath(); c.moveTo(mx-14,-10-h*.36); c.lineTo(mx+14,-10-h*.36); c.stroke(); }   // underste sejl gjort op under bording

      c.quadraticCurveTo(mx-w-belly,(yt+yb)/2,mx-w,yt); c.fill(); if(!small) c.stroke();
      c.strokeStyle=mastCol; c.lineWidth=1.2; c.beginPath(); c.moveTo(mx-w-1,yt); c.lineTo(mx+w+1,yt); c.stroke(); c.strokeStyle='rgba(60,45,25,.35)'; c.lineWidth=.7;
    });
  });
  // vimpel på stormasten
  if(!small && o.pennant){ const [mx,h]=M[1]; c.fillStyle=o.pennant; c.beginPath(); c.moveTo(mx,-10-h); c.lineTo(mx+16,-10-h+2+Math.sin(t*6)*1.5); c.lineTo(mx,-10-h+4); c.fill(); }
  // skrog
  const hull = new Path2D('M-46 -9 Q-41 6 -26 8 L30 8 Q44 6 47 -14 L48 -18 L37 -17 L35 -11 L-30 -11 Q-40 -11 -46 -9 Z');
  const hg = c.createLinearGradient(0,-18,0,9); hg.addColorStop(0,o.hullTop||'#6f4b2c'); hg.addColorStop(1,o.hullBot||'#24170e');
  c.fillStyle=hg; c.fill(hull);
  c.save(); c.clip(hull);
  c.fillStyle=o.stripe||'#c99b45'; c.fillRect(-50,-7.5,100,3.2);
  if(o.gunports){ c.fillStyle='#1a100a'; for(let gx=-30; gx<=34; gx+=8) c.fillRect(gx,-7.2,3.2,2.6); }
  c.fillStyle='rgba(0,0,0,.35)'; c.fillRect(-50,3,100,8);
  c.restore();
  c.strokeStyle='rgba(0,0,0,.6)'; c.lineWidth=small?1.4:.8; c.stroke(hull);
  if(!small){ c.fillStyle='#f6d58a'; for(let k=0;k<3;k++) c.fillRect(39+k*2.4,-15,1.4,1.8); }
  // flag på hækstang
  if(o.flag){ c.strokeStyle=mastCol; c.lineWidth=small?2:1.2; c.beginPath(); c.moveTo(46,-16); c.lineTo(50,-34); c.stroke();
    if(!o.noFlagCloth) flag(c, o.flag, 50, -34+(o.flagDrop||0), small?20:16, small?13:10, t, 1); }
  c.restore();
}

/* ---------- himmel og hav (sideperspektiv) ---------- */
function seaView(c, t, o){
  const H=o.horizon;
  const sky=c.createLinearGradient(0,0,0,H); o.sky.forEach((col,i)=>sky.addColorStop(i/(o.sky.length-1),col));
  c.fillStyle=sky; c.fillRect(o.x0,0,o.w,H+1);
  if(o.sun){ const g=c.createRadialGradient(o.sun[0],o.sun[1],0,o.sun[0],o.sun[1],o.sun[2]*5); g.addColorStop(0,o.sun[3]); g.addColorStop(.2,'rgba(255,210,140,.35)'); g.addColorStop(1,'rgba(255,200,120,0)');
    c.fillStyle=g; c.fillRect(o.x0,0,o.w,H); c.fillStyle=o.sun[3]; c.beginPath(); c.arc(o.sun[0],o.sun[1],o.sun[2],0,7); c.fill(); }
  if(o.clouds){ const R=mulberry(o.clouds); c.fillStyle=o.cloudCol||'rgba(255,255,255,.12)';
    for(let i=0;i<7;i++){ const cxp=o.x0+((R()*o.w + t*(2+R()*3)) % (o.w+60))-30, cy=R()*H*.6+4, w=20+R()*40; c.beginPath(); c.ellipse(cxp,cy,w,w*.18,0,0,7); c.fill(); } }
  if(o.coast){ c.fillStyle=o.coast; c.beginPath(); c.moveTo(o.x0,H); const R=mulberry(7); for(let x=o.x0;x<=o.x0+o.w;x+=o.w/12) c.lineTo(x,H-1.5-R()*3*(o.w/160)); c.lineTo(o.x0+o.w,H); c.fill(); }
  const sea=c.createLinearGradient(0,H,0,o.bottom); o.sea.forEach((col,i)=>sea.addColorStop(i/(o.sea.length-1),col));
  c.fillStyle=sea; c.fillRect(o.x0,H,o.w,o.bottom-H);
  if(o.sun){ c.fillStyle='rgba(255,210,140,.18)'; for(let i=0;i<10;i++){ const yy=H+3+i*i*0.9*(o.bottom-H)/90; const ww=(6+i*3)*(1+0.2*Math.sin(t*2+i)); c.fillRect(o.sun[0]-ww/2+Math.sin(t+i)*2,yy,ww,0.8+i*0.12); } }
  // bølger
  const R=mulberry(11); c.strokeStyle=o.wave||'rgba(200,230,240,.18)'; c.lineWidth=o.waveW||.6;
  for(let i=0;i<o.waves;i++){
    const ky=R(), yy=H+2+ky*ky*(o.bottom-H-2), sc=0.4+ky*1.6;
    const xx=o.x0+((R()*o.w + t*(3+ky*6)) % o.w), ww=3*sc*(o.w/160);
    c.globalAlpha=0.5+0.5*Math.sin(t*1.5+i); c.beginPath(); c.moveTo(xx-ww,yy); c.quadraticCurveTo(xx,yy-1.1*sc*(o.w/160)*.6,xx+ww,yy); c.stroke();
  }
  c.globalAlpha=1;
}

/* ---------- partikler (plask, ild, røg) ---------- */
let FX = [];
function fx(type, x, y, dur, extra={}){ FX.push(Object.assign({type,x,y,t0:now(),dur},extra)); }
function drawFX(c, layer){
  const n=now(); FX = FX.filter(f => n-f.t0 < f.dur);
  for(const f of FX){
    if((f.layer||'combat')!==layer) continue;
    const k=(n-f.t0)/f.dur;
    if(f.type==='spout'){   // vandsøjle (ISPLAT1)
      const h=f.h||16;
      for(let i=0;i<14;i++){ const a=-Math.PI/2+(i-6.5)*0.13; const r=h*Math.sin(Math.min(1,k*1.6)*Math.PI*0.5)*(1-k*0.4)*(0.6+0.4*Math.cos(i*1.7));
        c.fillStyle=`rgba(235,248,255,${0.85*(1-k)})`; c.beginPath(); c.arc(f.x+Math.cos(a)*r*.6, f.y+Math.sin(a)*r, 1.1+(1-k)*1.2, 0, 7); c.fill(); }
      c.fillStyle=`rgba(255,255,255,${0.7*(1-k)})`; c.beginPath(); c.ellipse(f.x,f.y,4+k*3,1.4,0,0,7); c.fill();
    } else if(f.type==='ripple'){   // ISPLAT2
      c.strokeStyle=`rgba(230,245,255,${0.8*(1-k)})`; c.lineWidth=.7;
      for(let i=0;i<3;i++){ const r=2+(k+i*0.3)*9; c.beginPath(); c.ellipse(f.x,f.y,r,r*0.22,0,0,7); c.stroke(); }
    } else if(f.type==='burst'){
      const r=3+k*10;
      const g=c.createRadialGradient(f.x,f.y,0,f.x,f.y,r); g.addColorStop(0,`rgba(255,240,180,${1-k})`); g.addColorStop(.4,`rgba(255,140,40,${.9*(1-k)})`); g.addColorStop(1,'rgba(120,30,10,0)');
      c.fillStyle=g; c.beginPath(); c.arc(f.x,f.y,r,0,7); c.fill();
      c.fillStyle=`rgba(60,40,25,${1-k})`; for(let i=0;i<8;i++){ const a=i*0.8+f.x; c.fillRect(f.x+Math.cos(a)*r*1.2, f.y+Math.sin(a)*r*1.2+k*k*8, 1.2, .8); }
    } else if(f.type==='smoke'){
      c.fillStyle=`rgba(${f.col||'210,210,205'},${(f.a||.5)*(1-k)})`; const r=(f.r||4)*(0.6+k*1.6);
      c.beginPath(); c.arc(f.x+(f.vx||0)*k, f.y-(f.vy||4)*k, r, 0, 7); c.fill();
    } else if(f.type==='flash'){
      c.fillStyle=`rgba(255,235,190,${(f.a||.6)*(1-k)})`; c.fillRect(f.x, f.y, f.w, f.h);
    }
  }
}

/* ---------- KORT (map.pic) — mobil: kortet i fuld højde, udsnittet følger skibet ---------- */
const MB = {x0:4, x1:306, y0:3, y1:157};          // kortets ramme inkl. gradbånd (kortkoordinater)

const TOWNS = [[255,125,'København',-1,9],[255,73,'Helsingør',-1,-3],[185,83,'Hundested',-1,-4],[95,15,'Grenå',1,3],[73,47,'Ebeltoft',1,3],[117,135,'Kalundborg',1,7],[247,33,'Mølle',-1,-3]];
let WAVEPTS = null, TREEPTS = null;
function initMapDecor(){
  const R=mulberry(42); WAVEPTS=[]; TREEPTS=[];
  for(let i=0;i<900 && WAVEPTS.length<90;i++){ const x=14+R()*282, y=14+R()*132; if(!onLand(x,y) && !onLand(x+4,y) && !onLand(x-4,y)) WAVEPTS.push([x,y,R()*6]); }
  for(let i=0;i<4000 && TREEPTS.length<420;i++){ const x=10+R()*290, y=10+R()*140; if(onLand(x,y)) TREEPTS.push([x,y,R()]); }
}
function drawMap(c, t, dt){
  if(!WAVEPTS) initMapDecor();
  const W=c.canvas.width, H=c.canvas.height, dpr=W/Math.max(1,c.canvas.getBoundingClientRect().width);
  const bw=MB.x1-MB.x0, bh=MB.y1-MB.y0, sFit=Math.min(W/bw,H/bh), sTall=H/bh;
  V.sx = ease(V.sx, S.IX, dt, 16); V.sy = ease(V.sy, S.IY, dt, 16);
  let ts, tox, toy, partial=false; const narrow = W/H < 1.2 && W/sTall < bw-1;   // kun stående: liggende viser hele kortet
  if(V.overview || !narrow){ ts=sFit; tox=(W-bw*ts)/2-MB.x0*ts; toy=(H-bh*ts)/2-MB.y0*ts; }
  else { partial=true; ts=sTall; const vw=W/ts, cw=Math.max(MB.x0+vw/2, Math.min(MB.x1-vw/2, V.sx+5.5)); tox=W/2-cw*ts; toy=-MB.y0*ts; }
  if(V.vW!==W || V.vH!==H){ V.vs=undefined; V.vox=undefined; V.voy=undefined; V.vW=W; V.vH=H; }   // ny størrelse: spring direkte
  V.vs=ease(V.vs,ts,dt,8); V.vox=ease(V.vox,tox,dt,8); V.voy=ease(V.voy,toy,dt,8);
  const sc=V.vs, ox=V.vox, oy=V.voy;
  VIEW = {s:sc/dpr, ox:ox/dpr, oy:oy/dpr};
  c.setTransform(1,0,0,1,0,0);
  const bg=c.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#0e2232'); bg.addColorStop(1,'#0a1824'); c.fillStyle=bg; c.fillRect(0,0,W,H);
  c.save(); c.setTransform(sc,0,0,sc,ox,oy);
  // gradbånd (skiftevis mørk/lys pr. kvadrat)
  for(let x=10;x<300;x+=10){ const odd=((x-10)/10)%2; c.fillStyle=odd?'#e9dcc0':'#2a2015'; c.fillRect(x,7.6,10,2.1); c.fillRect(x,150.3,10,2.1); }
  for(let y=10;y<150;y+=10){ const odd=((y-10)/10)%2; c.fillStyle=odd?'#e9dcc0':'#2a2015'; c.fillRect(7.6,y,2.1,10); c.fillRect(300.3,y,2.1,10); }
  c.strokeStyle='#d6aa54'; c.lineWidth=.45; c.strokeRect(7.4,7.4,295.2,145.2); c.strokeRect(10,10,290,140);
  c.save(); c.beginPath(); c.rect(10,10,290,140); c.clip();
  const sg=c.createLinearGradient(10,10,300,150); sg.addColorStop(0,'#1f5d80'); sg.addColorStop(.55,'#185070'); sg.addColorStop(1,'#123f5b'); c.fillStyle=sg; c.fillRect(10,10,290,140);
  const dg=c.createRadialGradient(170,45,5,170,45,90); dg.addColorStop(0,'rgba(5,25,45,.35)'); dg.addColorStop(1,'rgba(5,25,45,0)'); c.fillStyle=dg; c.fillRect(10,10,290,140);
  c.lineJoin='round';
  [[9,'rgba(110,190,205,.08)'],[5.5,'rgba(120,200,210,.12)'],[2.8,'rgba(150,215,220,.22)']].forEach(([w,col])=>{ c.strokeStyle=col; c.lineWidth=w; c.stroke(landPath); });
  // bølger
  c.strokeStyle='rgba(210,235,245,.28)'; c.lineWidth=.4;
  for(const [x,y,ph] of WAVEPTS){ c.globalAlpha=.35+.35*Math.sin(t*1.2+ph); const dx=Math.sin(t*.6+ph)*.8; c.beginPath(); c.moveTo(x-2.2+dx,y); c.quadraticCurveTo(x-1.1+dx,y-.9,x+dx,y); c.quadraticCurveTo(x+1.1+dx,y-.9,x+2.2+dx,y); c.stroke(); }
  c.globalAlpha=1;
  // kvadratnet
  c.lineWidth=.3; c.strokeStyle='rgba(215,235,245,.10)'; c.beginPath();
  for(let x=20;x<300;x+=10){ c.moveTo(x,10); c.lineTo(x,150); } for(let y=20;y<150;y+=10){ c.moveTo(10,y); c.lineTo(300,y); } c.stroke();
  c.lineWidth=.45; c.strokeStyle='rgba(214,170,84,.22)'; c.beginPath();
  for(let x=50;x<300;x+=50){ c.moveTo(x,10); c.lineTo(x,150); } for(let y=50;y<150;y+=50){ c.moveTo(10,y); c.lineTo(300,y); } c.stroke();
  // kompasrose
  c.save(); c.translate(160,36); c.globalAlpha=.32; c.fillStyle='#e9dcc0';
  for(let i=0;i<8;i++){ c.rotate(Math.PI/4); const L=i%2?7:12; c.beginPath(); c.moveTo(0,-L); c.lineTo(1.6,0); c.lineTo(-1.6,0); c.closePath(); c.fill(); }
  c.beginPath(); c.arc(0,0,9,0,7); c.strokeStyle='#e9dcc0'; c.lineWidth=.3; c.stroke(); c.globalAlpha=.5; c.font='bold 4px Alegreya Sans, sans-serif'; c.textAlign='center'; c.fillText('N',0,-14.5); c.restore();
  // land
  const lg=c.createLinearGradient(0,10,0,150); lg.addColorStop(0,'#cdb680'); lg.addColorStop(1,'#a99360'); c.fillStyle=lg; c.fill(landPath,'evenodd');
  c.save(); c.clip(landPath,'evenodd');
  for(const [x,y,r] of TREEPTS){ c.fillStyle=r<.6?'rgba(98,110,62,.38)':'rgba(130,110,70,.3)'; c.beginPath(); c.arc(x,y,.55+r*.6,0,7); c.fill(); }
  c.strokeStyle='rgba(110,80,40,.45)'; c.lineWidth=2.4; c.stroke(landPath);
  c.strokeStyle='rgba(255,245,215,.35)'; c.lineWidth=.9; c.stroke(landPath);
  c.restore();
  c.strokeStyle='#4a3a22'; c.lineWidth=.45; c.stroke(landPath);
  // stednavne
  c.textAlign='center'; c.textBaseline='middle';
  c.fillStyle='rgba(225,240,245,.42)'; c.font='italic 7px Alegreya, Georgia, serif';
  'KATTEGAT'.split('').forEach((ch,i)=>c.fillText(ch,150+i*7.5,63));

  c.save(); c.translate(18,58); c.rotate(-Math.PI/2); c.fillText('J Y L L A N D',0,0); c.restore();
  c.save(); c.translate(291,74); c.rotate(Math.PI/2); c.fillText('S K Å N E',0,0); c.restore();
  // havnebyer
  for(const [x,y,name,side,dy] of TOWNS){
    c.fillStyle='rgba(0,0,0,.35)'; c.beginPath(); c.arc(x+.3,y+.4,2.3,0,7); c.fill();
    c.fillStyle='#b8323a'; c.beginPath(); c.arc(x,y,2.1,0,7); c.fill(); c.strokeStyle='#f3e3c0'; c.lineWidth=.55; c.stroke();
    c.fillStyle='#f3e3c0'; c.beginPath(); c.arc(x,y,.6,0,7); c.fill();
    const lx=x+side*4.2, ly=y+dy; const land=onLand(lx+side*8,ly);
    c.font='700 5.4px Alegreya Sans, sans-serif'; c.textAlign=side<0?'right':'left';
    c.lineWidth=1.6; c.strokeStyle=land?'rgba(235,220,185,.75)':'rgba(10,30,45,.7)'; c.strokeText(name,lx,ly);
    c.fillStyle=land?'#2d2214':'#f3e3c0'; c.fillText(name,lx,ly);
  }
  // skibet (ISKIB) — glider til ny position og gynger på vandet
  V.sx = ease(V.sx, S.IX, dt, 16); V.sy = ease(V.sy, S.IY, dt, 16);
  if(!V.hideShip){
    const px=V.sx+5.5, py=V.sy+5.5;
    const gl=c.createRadialGradient(px,py,0,px,py,10); gl.addColorStop(0,'rgba(255,215,130,.45)'); gl.addColorStop(1,'rgba(255,215,130,0)'); c.fillStyle=gl; c.beginPath(); c.arc(px,py,10,0,7); c.fill();
    c.strokeStyle='rgba(255,255,255,.35)'; c.lineWidth=.35; c.beginPath(); c.ellipse(px,py+3.6,6+Math.sin(t*2)*.6,1.2,0,0,7); c.stroke();
    if(ctlMode==='map'){ c.strokeStyle='rgba(255,226,160,.38)'; c.lineWidth=.5; for(let i=0;i<8;i++){ const a=i*Math.PI/4, r=12.5+Math.sin(t*3)*.6;
        c.save(); c.translate(px+Math.cos(a)*r, py+Math.sin(a)*r); c.rotate(a); c.beginPath(); c.moveTo(-1.2,-1.6); c.lineTo(.8,0); c.lineTo(-1.2,1.6); c.stroke(); c.restore(); } }
    if(V.tapAt && now()-V.tapAt<500){ const k=(now()-V.tapAt)/500; c.strokeStyle=`rgba(255,226,160,${1-k})`; c.lineWidth=.6; c.beginPath(); c.arc(V.tapXY[0],V.tapXY[1],2+k*6,0,7); c.stroke(); }
    drawShip(c,{x:px,y:py+3.4+Math.sin(t*2.1)*.35,s:.125,flip:true,masts:2,flag:'dk',t,heel:Math.sin(t*1.7)*.07});
  }
  c.restore();
  if(V.dim){ c.fillStyle=`rgba(4,12,20,${V.dim})`; c.fillRect(10,10,290,140); }
  c.restore();
  // skærm-overlays: mere kort til siden, og overblik-mærkat

  const P=skyAt(s), night=Math.max(0,Math.min(1,-s/.22)), dayk=Math.max(0,Math.min(1,s/.3));

  if(night>0){ for(let i=0;i<45;i++){ const R=mulberry(i+7); const x=R()*320, y=R()*(H-20); c.fillStyle=`rgba(255,255,255,${night*(.3+.3*Math.sin(t*2+i))})`; c.fillRect(x,y,.8,.8); } }

    const g=c.createRadialGradient(moonX,moonY,0,moonX,moonY,40); g.addColorStop(0,`rgba(230,235,220,${.18*night})`); g.addColorStop(1,'rgba(230,235,220,0)'); c.fillStyle=g; c.fillRect(moonX-40,moonY-40,80,80);

    if(night>.3){ c.fillStyle=`rgba(243,236,214,${.16*night})`; for(let i=0;i<8;i++) c.fillRect(moonX-6-i,H+2+i*9,12+i*2,1); } }

  // små hyggelige ting (ikke når skibet vises tæt på)

    if(!TF.next) TF.next=n+4000;
    if(TF.ev && n-TF.ev.t0>TF.ev.dur) TF.ev=null;
    if(!TF.ev && n>TF.next){ const ok=TF_NAMES.filter(k=>k!==TF.last && !(TITLE_FX[k].day && dayk<.5) && !(TITLE_FX[k].night && night<.6));

  }

  { const dir=A.IVIND===1?-1:1; windStreaks(c,t,dir,30,150,.18,10); }
  const hk=(now()-A.hitAt)/500; if(hk>=0&&hk<1){ c.fillStyle=`rgba(200,40,58,${.45*(1-hk)})`; c.fillRect(0,0,320,200); }
  if(!A.started){ c.fillStyle='rgba(5,15,25,.55)'; c.fillRect(70,72,180,40); c.strokeStyle='#d6aa54'; c.lineWidth=.6; c.strokeRect(70,72,180,40);

}


/* ---------- byen bag havnen, set oppefra (tegnes én gang) ---------- */
let TOWN=null, TOWN_KBH=null, HAVN_NU=0;
function townCanvas(){
  if(HAVN_NU>2) return TOWN_LOCAL[HAVN_NU] || (TOWN_LOCAL[HAVN_NU] = localTown(townBase(), HAVN_NU));
  if(HAVN_NU===2) return TOWN_KBH || (TOWN_KBH = capitalTown(townBase()));
  if(TOWN) return TOWN;
  TOWN = townBase(); return TOWN;
}
function townBase(){
  const K=4, W=304, H=160, cvs=document.createElement('canvas'); cvs.width=W*K; cvs.height=H*K;
  const c=cvs.getContext('2d'); c.scale(K,K); const R=mulberry(77);
  // inderkaj af sten
  c.fillStyle='#8c8577'; c.fillRect(0,0,W,3); c.fillStyle='#6b665b'; c.fillRect(0,2.4,W,.8);
  // brosten
  c.fillStyle='#8f8676'; c.fillRect(0,3,W,H);
  for(let i=0;i<2600;i++){ c.fillStyle=R()<.5?'rgba(255,255,255,.07)':'rgba(0,0,0,.08)'; c.fillRect(R()*W,3+R()*H,.7,.7); }
  c.fillStyle='#a79d88'; c.fillRect(0,3,W,7);                      // havnegaden
  c.fillStyle='#3a3530'; for(let x=7;x<W;x+=16){ c.beginPath(); c.arc(x,4.4,.7,0,7); c.fill(); }   // pullerter
  for(let x=20;x<W;x+=46){ c.fillStyle='#7a5a36'; c.fillRect(x,6,3,2.4); c.fillRect(x+4,6.4,2,2); }  // tønder og kasser
  const roofs=[['#b65036','#8a3424'],['#a8452f','#7d2f20'],['#5a5862','#3c3b43'],['#bda56a','#957f48'],['#9c3b2b','#6f271b'],['#c06a3e','#93492a']];
  const house=(x,y,w,d)=>{ const [lt,dk]=roofs[Math.floor(R()*roofs.length)];
    c.fillStyle='rgba(0,0,0,.3)'; c.fillRect(x+.7,y+.9,w,d);
    c.fillStyle=lt; c.fillRect(x,y,w,d/2); c.fillStyle=dk; c.fillRect(x,y+d/2,w,d/2);
    c.strokeStyle='rgba(0,0,0,.16)'; c.lineWidth=.22; c.beginPath(); for(let ty=y+1.1;ty<y+d;ty+=1.1){ c.moveTo(x,ty); c.lineTo(x+w,ty); } c.stroke();
    c.strokeStyle='rgba(0,0,0,.5)'; c.lineWidth=.4; c.beginPath(); c.moveTo(x,y+d/2); c.lineTo(x+w,y+d/2); c.stroke();
    c.strokeStyle='rgba(0,0,0,.35)'; c.lineWidth=.3; c.strokeRect(x,y,w,d);
    if(R()<.65){ c.fillStyle='#3e322c'; c.fillRect(x+w*(.2+R()*.6), y+d/2+(R()<.5?-2.1:.7), 1.3, 1.3); }
  };
  const tree=(x,y,r)=>{ c.fillStyle='rgba(0,0,0,.28)'; c.beginPath(); c.arc(x+.9,y+.9,r,0,7); c.fill();
    c.fillStyle='#55743a'; c.beginPath(); c.arc(x,y,r,0,7); c.fill(); c.fillStyle='rgba(190,215,120,.35)'; c.beginPath(); c.arc(x-r*.3,y-r*.3,r*.55,0,7); c.fill(); };
  const row=(x0,x1,y,d)=>{ for(let x=x0;x<x1-3;){ const w=Math.min(x1-x, 6+R()*7); if(w<3) break; house(x,y,w,d); x+=w; } };
  let y=12, r=0, church=false;
  while(y<H-6){
    const bh=26; let x=1;
    while(x<W-6){
      const bw=Math.min(W-1-x, 34+R()*34);
      if(!church && r===1 && x>100){   // kirke på torvet
        church=true; c.fillStyle='#a79d88'; c.fillRect(x,y,bw,bh);
        const nx=x+bw*.3, nw=bw*.5, ny=y+8, nd=11;
        c.fillStyle='rgba(0,0,0,.3)'; c.fillRect(nx+1,ny+1,nw,nd); c.fillStyle='#4f5260'; c.fillRect(nx,ny,nw,nd/2); c.fillStyle='#383a46'; c.fillRect(nx,ny+nd/2,nw,nd/2);
        c.strokeStyle='rgba(0,0,0,.5)'; c.lineWidth=.4; c.beginPath(); c.moveTo(nx,ny+nd/2); c.lineTo(nx+nw,ny+nd/2); c.stroke();
        const tx=nx-8, ty=ny+1.5, ts=9; c.fillStyle='rgba(0,0,0,.35)'; c.fillRect(tx+1.2,ty+1.2,ts,ts);
        [['#7fb7a3',[tx,ty],[tx+ts,ty]],['#4a7d6c',[tx+ts,ty],[tx+ts,ty+ts]],['#3b6658',[tx+ts,ty+ts],[tx,ty+ts]],['#6aa38e',[tx,ty+ts],[tx,ty]]].forEach(([col,a,b])=>{ c.fillStyle=col; c.beginPath(); c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); c.lineTo(tx+ts/2,ty+ts/2); c.closePath(); c.fill(); });
        c.fillStyle='#d6aa54'; c.beginPath(); c.arc(tx+ts/2,ty+ts/2,.7,0,7); c.fill();
        tree(x+4,y+4,2.6); tree(x+bw-5,y+bh-5,3); tree(x+bw-6,y+5,2.4);
      } else if(r>=2 && R()<.08){   // torv med brønd og boder
        c.fillStyle='#a79d88'; c.fillRect(x,y,bw,bh);
        c.fillStyle='#5d5850'; c.beginPath(); c.arc(x+bw/2,y+bh/2,2.4,0,7); c.fill(); c.fillStyle='#2b4f66'; c.beginPath(); c.arc(x+bw/2,y+bh/2,1.4,0,7); c.fill();
        const st=['#c8283a','#efe6d0','#d6aa54','#3f6f8f']; for(let i=0;i<5;i++){ c.fillStyle=st[i%4]; c.fillRect(x+3+i*(bw-8)/5,y+3,3.4,2.6); c.fillStyle='rgba(0,0,0,.2)'; c.fillRect(x+3+i*(bw-8)/5,y+5.4,3.4,.5); }
        tree(x+4,y+bh-4,2.4);
      } else {   // karré: huse ud mod gaderne, have i midten
        c.fillStyle='#6d8550'; c.fillRect(x,y,bw,bh);
        for(let i=0;i<40;i++){ c.fillStyle='rgba(30,50,20,.18)'; c.fillRect(x+R()*bw,y+R()*bh,.8,.8); }
        row(x,x+bw,y,9); row(x,x+bw,y+bh-9,9);
        const n=1+Math.floor(R()*3); for(let i=0;i<n;i++) tree(x+4+R()*(bw-8), y+12+R()*2, 1.8+R()*1.2);
      }
      x+=bw+4.5;
    }
    y+=bh+5; r++;
  }
  return cvs;
}

function combatBg(c,t){ seaView(c,t,{x0:150,w:160,horizon:57,bottom:100,sky:['#2a4560','#7e98aa','#c9d1cf'],sea:['#3f6b84','#173d55','#0e2a3d'],clouds:8,cloudCol:'rgba(255,255,255,.18)',waves:70,coast:'#5e6f74'}); }
function enemyShip(c,t,o={}){

  drawShip(c,Object.assign({x:226,y:69+Math.sin(t*1.2)*.4,s:.5,masts:3,flag:I===8?'jolly':'uk',t,gunports:true,

function drawCombat(c, t, st=V){
  c.save(); c.setTransform(c.getTransform().a*2,0,0,c.getTransform().d*2,0,0); c.translate(-150,0);
  combatBg(c,t);
  if(st.sink){ const k=Math.min(1,(now()-st.sink)/2200); c.save(); c.beginPath(); c.rect(150,0,160,71); c.clip(); enemyShip(c,t,{y:69+k*48,heel:k*.35,noFlagCloth:!!st.struck}); c.restore();
    if(k<1) for(let i=0;i<2;i++) fx('smoke',215+Math.random()*25,70,900,{r:2,vy:6,a:.35,col:'230,240,245'}); }
  else if(!st.gone){
    const o={flagDrop:st.flagDrop||0, noFlagCloth:!!st.struck, ...(st.prizeFlag?{flag:st.prizeFlag}:{})};
    if(st.sail){   // prisen vender (bliver smal når stævnen peger mod os) og sejler ud til højre
      const e=now()-st.sail, k=Math.min(1,e/1000), sx=Math.cos(Math.PI*sm(k)), x=226+Math.max(0,(e-1000)/14);
      c.save(); c.translate(x,0); c.scale(Math.sign(sx||-1)*Math.max(.12,Math.abs(sx)),1); c.translate(-x,0); enemyShip(c,t,Object.assign(o,{x})); c.restore();
    } else enemyShip(c,t,o);
  }
  c.fillStyle='rgba(220,240,250,.18)'; c.fillRect(150,69.5+Math.sin(t*2)*.3,160,.8);
  drawFX(c,'combat');
  if(st.cross){ const x=230+S.ISIDE, y=50+S.IELEVA;
    c.strokeStyle='rgba(0,0,0,.45)'; c.lineWidth=1.6; c.beginPath(); c.arc(x,y,6,0,7); c.moveTo(x-10,y); c.lineTo(x-3,y); c.moveTo(x+3,y); c.lineTo(x+10,y); c.moveTo(x,y-10); c.lineTo(x,y-3); c.moveTo(x,y+3); c.lineTo(x,y+10); c.stroke();
    c.strokeStyle='#ffd27a'; c.lineWidth=.7; c.stroke(); c.fillStyle='#ffd27a'; c.beginPath(); c.arc(x,y,.7,0,7); c.fill(); }
  const fk=(now()-(st.fireAt||0))/500; if(fk>=0&&fk<1){ c.fillStyle=`rgba(255,230,170,${.5*(1-fk)})`; c.fillRect(150,0,160,100); }
  c.restore();
}

function sailor(c,x,y,t,i){ // lille figur med sabel; y = fødder
  c.fillStyle='#1a120c'; c.fillRect(x,y-2.2,1.1,2.2); c.beginPath(); c.arc(x+.55,y-2.8,.6,0,7); c.fill();

}
function fencer(c,x,y,dir,coat,hat,t,ph,o={}){ // figur der fægter; dir 1 = vender mod højre
  // o: spd (tempo), style (0 fægt, 1 hug, 2 stød, 3 parade), pants, skin, head ('hat','tricorn','bandana','cap','bare'), sz
  const spd=o.spd||6, st=o.style||0, sz=o.sz||1, T=t*spd+ph, sn=Math.sin(T);
  let lunge, a, reach=2.5;
  if(st===1){ const k=Math.pow(Math.max(0,Math.sin(T)),3); lunge=k*.5; a=-1.5+k*2.2; }            // hug oppefra
  else if(st===2){ const k=Math.max(0,Math.sin(T)); lunge=k*1.2-.3; a=-.15+Math.sin(T*.5)*.1; reach=2.5+k*.6; }   // stød
  else if(st===3){ lunge=Math.sin(T*.5)*.25; a=-.9+Math.sin(T*1.7)*.35+Math.sin(T*3.1)*.15; }     // parade
  else { lunge=sn*.6; a=-.5+sn*.45; }
  const bob=Math.abs(Math.sin(T*.5))*.15;
  c.save(); c.translate(x+lunge*dir,y-bob); c.scale(dir*sz,sz);
  c.strokeStyle=o.pants||'#1a120c'; c.lineWidth=.55; c.lineCap='round';
  const sp=st===2?.35+Math.max(0,sn)*.4:0;
  c.beginPath(); c.moveTo(-sp,0); c.lineTo(.7,-1.8); c.moveTo(1.6+sp,0); c.lineTo(.9,-1.8); c.stroke();     // ben
  c.fillStyle=coat; c.fillRect(.1,-3.9,1.6,2.2);                                                          // trøje/frakke
  if(o.belt){ c.fillStyle=o.belt; c.fillRect(.1,-2.2,1.6,.35); }
  c.fillStyle=o.skin||'#e2c4a0'; c.beginPath(); c.arc(.9,-4.6,.7,0,7); c.fill();                           // hoved
  const hd=o.head||'hat';
  if(hd==='hat'){ c.fillStyle=hat; c.fillRect(.1,-5.5,1.6,.55); }
  else if(hd==='tricorn'){ c.fillStyle=hat; c.beginPath(); c.moveTo(-.3,-5.05); c.lineTo(2.1,-5.05); c.lineTo(1.6,-5.75); c.lineTo(.9,-5.45); c.lineTo(.2,-5.75); c.closePath(); c.fill(); }
  else if(hd==='bandana'){ c.fillStyle=hat; c.beginPath(); c.arc(.9,-4.85,.72,Math.PI,0); c.fill(); c.beginPath(); c.moveTo(.2,-4.9); c.lineTo(-.6,-4.5+Math.sin(T*2)*.2); c.lineTo(-.4,-4.2+Math.sin(T*2)*.2); c.closePath(); c.fill(); }
  else if(hd==='cap'){ c.fillStyle=hat; c.beginPath(); c.arc(.9,-5,.68,Math.PI,0); c.quadraticCurveTo(.6,-6.2,-.3,-5.6); c.lineTo(.2,-5.1); c.closePath(); c.fill(); }   // strikket toplue
  else if(hd==='round'){ c.fillStyle=hat; c.fillRect(-.1,-5.15,2,.3); c.fillRect(.35,-5.8,1.1,.7); }   // lav rund hat
  else { c.fillStyle=o.hair||'#3a2716'; c.beginPath(); c.arc(.9,-4.9,.62,Math.PI*1.05,-.1); c.fill(); }
  c.strokeStyle=coat; c.lineWidth=.5; c.beginPath(); c.moveTo(1.4,-3.4); c.lineTo(reach,-3.4+a); c.stroke();   // sabelarm
  c.strokeStyle=o.blade||'#e8ecef'; c.lineWidth=.32; c.beginPath(); c.moveTo(reach,-3.4+a); c.lineTo(reach+2.5,-3.6+a*2.2); c.stroke();
  c.restore();
}

function finShape(c,x,y,dir,sc,col,sink=0){
  c.save(); c.beginPath(); c.rect(x-12*sc,y-20*sc,24*sc,20*sc); c.clip();
  c.translate(x,y+sink*15*sc); c.scale(dir*sc,sc); c.fillStyle=col;
  c.beginPath(); c.moveTo(6.5,0); c.quadraticCurveTo(1.5,-12,-2.5,-14); c.quadraticCurveTo(-2.5,-6,-6.5,0); c.closePath(); c.fill(); c.strokeStyle='rgba(170,195,210,.45)'; c.lineWidth=.5/sc; c.beginPath(); c.moveTo(6.5,0); c.quadraticCurveTo(1.5,-12,-2.5,-14); c.stroke(); c.restore();
  if(sink<.9){ c.strokeStyle=`rgba(220,235,245,${.4*(1-sink)})`; c.lineWidth=.6; c.beginPath(); c.moveTo(x-dir*14*sc,y+.4); c.lineTo(x+dir*8*sc,y+.4); c.stroke(); }
}
function swimmer(c,m,t,alpha){
  const sc=m.s, x=m.x+Math.sin(t*.6+m.ph)*1.5, y=m.y+Math.sin(t*2.2+m.ph)*.6;
  c.save(); c.globalAlpha=alpha;
  c.strokeStyle='rgba(220,235,245,.35)'; c.lineWidth=.6; c.beginPath(); c.ellipse(x,y+.6,6.5*sc,1.5*sc,0,0,7); c.stroke();
  const wave=Math.max(0,Math.sin(t*m.sp+m.ph)), a1=Math.sin(t*m.sp*2+m.ph)*1.4*wave, a2=Math.sin(t*m.sp*2+m.ph+2)*1.4;
  c.strokeStyle=m.skin; c.lineWidth=1.1*sc; c.lineCap='round'; c.beginPath();
  c.moveTo(x-2.3*sc,y-.8*sc); c.lineTo(x-3.6*sc+a1*sc*.6,y-(2.5+4*wave)*sc);
  c.moveTo(x+2.3*sc,y-.8*sc); c.lineTo(x+4*sc+a2*sc*.4,y-(4+2.5*Math.max(0,Math.sin(t*m.sp+m.ph+1.6)))*sc); c.stroke();
  c.fillStyle=m.shirt; c.beginPath(); c.ellipse(x,y,3.1*sc,1.4*sc,0,Math.PI,0); c.fill();
  c.fillStyle=m.skin; c.beginPath(); c.arc(x,y-2.3*sc,1.7*sc,0,7); c.fill();
  c.fillStyle=m.hair; c.beginPath(); c.arc(x,y-2.6*sc,1.75*sc,Math.PI*1.02,-.02); c.fill();
  c.restore();
}
function drawCastaways(c,t,k){
  const n=now();
  if(!V.E){
    const shirts=['#2a4a7a','#e9e2cf','#7a5a2e','#3a6b4a','#b8323a','#c8a040','#5a2a5e'], hairs=['#3a2716','#b8863a','#1a120c','#7a4a22'], skins=['#e2c4a0','#d8b48c','#c9a27c'];
    const men=[]; const cnt=6;
    for(let i=0;i<cnt;i++){ const y=134+Math.random()*34; men.push({x:96+i*(130/(cnt-1))+(Math.random()-.5)*10, y, s:1+(y-130)/40*.55, ph:Math.random()*6, sp:2.5+Math.random()*2.5,
      shirt:shirts[i%shirts.length], hair:hairs[i%hairs.length], skin:skins[i%skins.length], gone:0, hunted:false}); }
    const sharks=[0,1,2].map(i=>({mode:'circle', a:i*2.1+Math.random(), w:(.35+Math.random()*.2)*(i===1?-1:1), rx:78+i*8, ry:20+i*4, x:0, y:0, dir:1, t0:0}));
    V.E={men, sharks, next:n+3500+Math.random()*2000, last:n};
  }
  const E=V.E, dt=Math.min(.1,(n-E.last)/1000); E.last=n;
  const appear=Math.max(0,Math.min(1,(k-.55)/.45));
  if(appear<=0) return;
  E.rS = ease(E.rS, E.rT||1, dt, 1.6);
  const cx=160, cy=152, circPos=sh=>[cx+Math.cos(sh.a)*sh.rx*E.rS, cy+Math.sin(sh.a)*sh.ry*E.rS];
  if(E.syn) E.synA += .8*dt;
  eggTick(E,appear,dt,t);
  // jagt: en haj forlader cirklen og svømmer hen til en tilfældig skibbruden
  if(n>E.next && appear>.99 && !E.ev){
    const live=E.men.filter(m=>!m.gone && !m.hunted), free=E.sharks.filter(sh=>sh.mode==='circle');
    if(live.length && free.length){ const m=live[Math.floor(Math.random()*live.length)], sh=free[Math.floor(Math.random()*free.length)];
      m.hunted=true; sh.mode='hunt'; sh.m=m; sh.fx=sh.x; sh.fy=sh.y; sh.t0=n; sh.dur=Math.max(1100, Math.hypot(m.x-sh.x,m.y-sh.y)*28); }
    E.next=n+3000+Math.random()*3500;
  }
  const items=[];
  for(const sh of E.sharks){
    let sink=0;
    if(sh.mode==='circle'){ if(E.syn){ sh.a=E.synA+E.sharks.indexOf(sh)*2.0944; sh.dir=(-Math.sin(sh.a))>=0?1:-1; } else { sh.a+=sh.w*dt; sh.dir=(-Math.sin(sh.a)*sh.w)>=0?1:-1; } const [x,y]=circPos(sh); sh.x=x; sh.y=y; }
    else if(sh.mode==='ext'){ sink=sh.esink||0; }
    else if(sh.mode==='hunt'){ const q=Math.min(1,(n-sh.t0)/sh.dur), e=q*q*(3-2*q); sh.dir=sh.m.x>=sh.fx?1:-1;
      sh.x=lerp(sh.fx,sh.m.x+sh.dir*1.5,e); sh.y=lerp(sh.fy,sh.m.y+1,e);
      if(q>=1){ sh.m.gone=n; sh.mode='dive'; sh.t0=n; } }
    else if(sh.mode==='dive'){ sink=Math.min(1,(n-sh.t0)/700); if(sink>=1 && n-sh.t0>1800){ sh.mode='rise'; sh.t0=n; sh.a=Math.random()*6.28; const [x,y]=circPos(sh); sh.x=x; sh.y=y; } }
    else if(sh.mode==='rise'){ sh.a+=sh.w*dt; const [x,y]=circPos(sh); sh.x=x; sh.y=y; sh.dir=(-Math.sin(sh.a)*sh.w)>=0?1:-1; sink=1-Math.min(1,(n-sh.t0)/900); if(sink<=0) sh.mode='circle'; }
    if(sh.hide) continue;
    const sc=.95+(sh.y-130)/40*.5;
    items.push({y:sh.y, draw:()=>finShape(c,sh.x,sh.y,sh.dir,sc,'#1b2f3f',sink)});
  }
  for(const m of E.men){
    if(m.gone){ const q=(n-m.gone)/1000; if(q<1) items.push({y:m.y, draw:()=>{   // plask
        c.strokeStyle=`rgba(230,245,255,${.8*(1-q)})`; c.lineWidth=.7; for(let i=0;i<3;i++){ const r=(2+(q+i*.25)*10)*m.s; c.beginPath(); c.ellipse(m.x,m.y,r,r*.25,0,0,7); c.stroke(); }
        c.fillStyle=`rgba(235,248,255,${.85*(1-q)})`; for(let i=0;i<8;i++){ const a=-Math.PI/2+(i-3.5)*.3, h=Math.sin(Math.min(1,q*2)*Math.PI)*8*m.s; c.beginPath(); c.arc(m.x+Math.cos(a)*h*.8, m.y+Math.sin(a)*h, .8, 0, 7); c.fill(); } }});
      continue; }
    items.push({y:m.y, draw:()=>swimmer(c,m,t,appear)});
  }
  eggLayer(c,t,E,'back');
  items.sort((a,b)=>a.y-b.y).forEach(it=>it.draw());
  eggLayer(c,t,E,'front'); drawParrot(c,t,E); drawCap(c,E);
}
/* ================= PÅSKEÆG på slutskærmen =================
   Når mandskabet er i vandet, sker der noget sjovt hvert 30.–120. sekund. Kun grafik – spillogikken røres ikke. */
const sm = k => k<=0?0:k>=1?1:k*k*(3-2*k);
const bell = (k,a,b,f=.12) => k<a||k>b ? 0 : Math.min(1,(k-a)/f,(b-k)/f);
function eggCap(E,txt,dur=4200){ E.cap={txt,t0:now(),dur}; }
function drawCap(c,E){
  const C=E.cap; if(!C) return; const q=(now()-C.t0)/C.dur; if(q>=1){ E.cap=null; return; }
  const a=Math.min(1,q*8,(1-q)*6); c.save(); c.globalAlpha=a;
  c.font='italic 8.4px Alegreya, Georgia, serif'; c.textAlign='center'; c.textBaseline='middle';
  const w=Math.min(306,c.measureText(C.txt).width+16); c.fillStyle='rgba(8,20,31,.82)'; rrect(c,160-w/2,6,w,15,7.5); c.fill();
  c.strokeStyle='rgba(214,170,84,.55)'; c.lineWidth=.5; c.stroke(); c.fillStyle='#efe6d0'; c.fillText(C.txt,160,13.8,296); c.restore();
}
function person(c,x,y,p,t=0){   // siddende figur; y = sædet
  c.fillStyle=p.coat; if(p.dress){ c.beginPath(); c.moveTo(x-1.6,y); c.lineTo(x-1.1,y-4.2); c.lineTo(x+1.1,y-4.2); c.lineTo(x+1.6,y); c.fill(); } else c.fillRect(x-1.2,y-4.2,2.4,4.2);
  if(p.arm!==undefined){ c.strokeStyle=p.sleeve||p.coat; c.lineWidth=.8; c.lineCap='round'; c.beginPath(); c.moveTo(x+.8,y-3.6); c.lineTo(x+.8+Math.cos(p.arm)*3,y-3.6+Math.sin(p.arm)*3); c.stroke(); }
  c.fillStyle=p.skin||'#e2c4a0'; c.beginPath(); c.arc(x,y-5.3,1.25,0,7); c.fill();
  const h=p.head; c.fillStyle=p.hat||'#1a120c';
  if(h==='tricorn'){ c.beginPath(); c.moveTo(x-2,y-6); c.lineTo(x+2,y-6); c.lineTo(x+1.2,y-7.3); c.lineTo(x,y-6.8); c.lineTo(x-1.2,y-7.3); c.closePath(); c.fill(); }
  else if(h==='veil'){ c.fillStyle='rgba(255,255,255,.9)'; c.beginPath(); c.moveTo(x-1.3,y-6.4); c.quadraticCurveTo(x-3.5,y-4,x-3.2,y-1.5); c.lineTo(x-1,y-5); c.fill(); c.beginPath(); c.arc(x,y-5.8,1.35,Math.PI,0); c.fill(); }
  else if(h==='sydvest'){ c.beginPath(); c.ellipse(x,y-6.2,2.2,.6,0,0,7); c.fill(); c.beginPath(); c.arc(x,y-6.2,1.3,Math.PI,0); c.fill(); }
  else if(h==='bandana'){ c.beginPath(); c.arc(x,y-5.6,1.35,Math.PI,0); c.fill(); c.beginPath(); c.moveTo(x-1.2,y-5.6); c.lineTo(x-2.6,y-4.6+Math.sin(t*5)*.3); c.lineTo(x-2,y-4.2); c.fill(); }
  else if(h==='cap'){ c.beginPath(); c.arc(x,y-5.8,1.3,Math.PI,0); c.quadraticCurveTo(x-.6,y-8,x-2.2,y-7.2); c.lineTo(x-1.4,y-6.4); c.closePath(); c.fill(); }   // strikket toplue
  else if(h==='round'){ c.fillRect(x-2.1,y-6.3,4.2,.6); c.beginPath(); c.ellipse(x,y-6.4,1.35,.95,0,Math.PI,0); c.fill(); }   // lav rund hat
  else { c.fillStyle=p.hair||'#3a2716'; c.beginPath(); c.arc(x,y-5.6,1.3,Math.PI,0); c.fill(); }
}
function rowboat(c,x,y,dir,s,t,crew,o={}){
  c.save(); c.translate(x,y); c.scale(dir*s,s);
  c.strokeStyle='rgba(220,235,245,.35)'; c.lineWidth=.5; c.beginPath(); c.moveTo(-26,3.6); c.lineTo(-10,3.6); c.stroke();
  if(!o.noOars){ const oa=Math.sin(t*3.2); c.strokeStyle='#8a6a48'; c.lineWidth=.7; c.beginPath(); c.moveTo(-2,-2.4); c.lineTo(-7+oa*4,3.6); c.stroke(); }
  if(o.sign){ c.font='700 3.4px "Alegreya Sans", sans-serif'; const sw=c.measureText(o.sign).width+3; c.strokeStyle='#5a3a20'; c.lineWidth=.6; c.beginPath(); c.moveTo(7,-3); c.lineTo(7,-13); c.stroke(); c.fillStyle='#efe6d0'; c.fillRect(8.5-sw/2,-18,sw,5.5);
    c.save(); c.scale(dir,1); c.fillStyle='#8e1424'; c.font='700 3.4px "Alegreya Sans", sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(o.sign,dir*8.5,-15.2); c.restore(); }
  crew.forEach(p=>person(c,p.x,-3,p,t));
  c.fillStyle=o.hull||'#6f4b2c'; c.beginPath(); c.moveTo(-12,-3); c.lineTo(12,-3.6); c.quadraticCurveTo(11,3,6,3.5); c.lineTo(-8,3.5); c.quadraticCurveTo(-12,2,-12,-3); c.fill();
  c.fillStyle='#c99b45'; c.fillRect(-12,-3.6,24,.8); c.restore();
}
function sharkBody(c,x,y,ang,sc){
  c.save(); c.translate(x,y); c.rotate(ang); c.scale(sc,sc); c.fillStyle='#4f6372';
  c.beginPath(); c.moveTo(14,0); c.quadraticCurveTo(6,-5,-8,-2.4); c.lineTo(-14,-6.5); c.lineTo(-11.5,0); c.lineTo(-14,6); c.lineTo(-8,2.4); c.quadraticCurveTo(6,5,14,0); c.fill();

function gull(c,x,y,flap,s=1){
  c.save(); c.translate(x,y); c.scale(s,s); c.fillStyle='#eef2f4'; c.beginPath(); c.ellipse(0,0,2.6,1.1,0,0,7); c.fill(); c.beginPath(); c.arc(2.2,-.7,.9,0,7); c.fill();
  c.fillStyle='#e3a14a'; c.beginPath(); c.moveTo(3,-.8); c.lineTo(4.3,-.5); c.lineTo(3,-.3); c.fill();
  c.strokeStyle='#dfe6ea'; c.lineWidth=.8; c.lineCap='round'; c.beginPath();
  if(flap===null){ c.moveTo(-1.5,-.4); c.lineTo(1,-.6); } else { const w=Math.sin(flap)*2.6; c.moveTo(0,-.3); c.quadraticCurveTo(-1.5,-1.5-w,-3.5,-w*1.3); } c.stroke(); c.restore();
}
function tentacle(c,x,y,h,t,curl){
  if(h<=0) return; c.save(); c.beginPath(); c.rect(x-40,y-80,80,80.5); c.clip(); c.lineCap='round';
  const P=[]; for(let i=0;i<=14;i++){ const q=i/14; P.push([x+Math.sin(q*3.2+t*2.4)*4*q+curl*q*q*9, y+4-(h+4)*q]); }
  for(let i=0;i<14;i++){ c.strokeStyle='#8a3b5a'; c.lineWidth=(1-i/14)*5.2+.7; c.beginPath(); c.moveTo(P[i][0],P[i][1]); c.lineTo(P[i+1][0],P[i+1][1]); c.stroke(); }
  c.fillStyle='#e7b8c8'; for(let i=1;i<13;i+=2){ c.beginPath(); c.arc(P[i][0]+(1-i/14)*1.8,P[i][1],(1-i/14)*.9+.3,0,7); c.fill(); }
  c.restore();
}
function sparkle(c,x,y,r,a){ c.fillStyle=`rgba(255,250,225,${a})`; c.beginPath(); c.moveTo(x,y-r); c.lineTo(x+r*.25,y); c.lineTo(x,y+r); c.lineTo(x-r*.25,y); c.closePath(); c.fill(); c.beginPath(); c.moveTo(x-r,y); c.lineTo(x,y+r*.25); c.lineTo(x+r,y); c.lineTo(x,y-r*.25); c.closePath(); c.fill(); }
function splashAt(c,x,y,q,s=1){ if(q<0||q>1) return; c.strokeStyle=`rgba(230,245,255,${.8*(1-q)})`; c.lineWidth=.7; for(let i=0;i<3;i++){ const r=(2+(q+i*.25)*9)*s; c.beginPath(); c.ellipse(x,y,r,r*.25,0,0,7); c.stroke(); }
  c.fillStyle=`rgba(235,248,255,${.85*(1-q)})`; for(let i=0;i<8;i++){ const a=-Math.PI/2+(i-3.5)*.3, h=Math.sin(Math.min(1,q*2)*Math.PI)*8*s; c.beginPath(); c.arc(x+Math.cos(a)*h*.8,y+Math.sin(a)*h,.8,0,7); c.fill(); } }

const EGG_NAMES = Object.keys(EGG);
function eggStart(E,name){ const G=EGG[name]; if(!G || (G.ok && !G.ok(E))) return false; const ev={name,t0:now(),dur:G.dur,st:{}}; E.ev=ev; if(G.start) G.start(E,ev); return true; }
function eggTick(E,appear,dt,t){
  const n=now();
  if(E.eggNext===undefined){ if(appear<=.99) return; E.eggNext=n+8000; }   // første påskeæg 8 s efter mandskabet er i vandet (dobbelt så lang tid som på startsiden)
  if(E.ev){ const ev=E.ev, G=EGG[ev.name]; if(n-ev.t0>=ev.dur){ if(G.end) G.end(E,ev); E.ev=null; E.eggNext=n+(12+Math.random()*18)*1000; /* næste 12–30 s efter at det forrige er slut */ } else if(G.upd) G.upd(E,ev,(n-ev.t0)/ev.dur,dt,t); }
  if(!E.ev && appear>.99 && n>E.eggNext){
    for(let tries=0;tries<EGG_NAMES.length;tries++){
      if(!E.bag || !E.bag.length){ E.bag=EGG_NAMES.slice().sort(()=>Math.random()-.5); if(E.bag[E.bag.length-1]===E.lastEgg) E.bag.unshift(E.bag.pop()); }
      const nm=E.bag.pop(); if(eggStart(E,nm)){ E.lastEgg=nm; break; }
    }
    if(!E.ev) E.eggNext=n+(12+Math.random()*18)*1000;
  }
}
function eggLayer(c,t,E,layer){ const ev=E.ev; if(!ev) return; const G=EGG[ev.name]; if(G[layer]) G[layer](c,t,Math.min(1,(now()-ev.t0)/ev.dur),ev,E); }
function drawParrot(c,t,E){
  const P=E.parrot; if(!P) return; const q=(now()-P)/4500; if(q>=1){ E.parrot=0; return; }
  const x=lerp(250,-20,q)+Math.sin(q*9)*14, y=40+Math.sin(q*Math.PI)*40-q*10, w=Math.sin(t*18)*3;
  c.save(); c.translate(x,y); c.scale(-1.6,1.6);
  c.fillStyle='#c8283a'; c.beginPath(); c.ellipse(0,0,3,1.6,-.2,0,7); c.fill(); c.beginPath(); c.arc(2.6,-1.2,1.4,0,7); c.fill();
  c.fillStyle='#f2d250'; c.beginPath(); c.moveTo(3.8,-1.4); c.quadraticCurveTo(5.4,-1,4.2,.2); c.fill(); c.fillStyle='#fff'; c.beginPath(); c.arc(3,-1.5,.45,0,7); c.fill();
  c.fillStyle='#2f6fd0'; c.beginPath(); c.moveTo(0,-.5); c.quadraticCurveTo(-2,-3-w,-4,-1-w); c.lineTo(-1,.3); c.fill(); c.fillStyle='#3a9a4a'; c.beginPath(); c.moveTo(-2.6,.4); c.lineTo(-6,1.6); c.lineTo(-2.4,1.2); c.fill();
  c.restore();
}
function endTap(x,y){
  const E=V.E; if(!E) return; const t=now()/1000;
  if(E.ev){ const G=EGG[E.ev.name]; if(G.tap && G.tap(x,y,E.ev,E,t)) return; }
  if(Math.hypot(x-250,y-40)<16){ const n=now(); E.moonN = (n-(E.moonT||0)<2500 ? (E.moonN||0) : 0)+1; E.moonT=n;
    if(E.moonN>=5){ E.moonN=0; E.parrot=n; eggCap(E,'»Game over! Rrrraaa!«',3800); sweep(1800,2600,.18,'square',.03); sweep(2600,1500,.2,'square',.03,.2); } }
}

function drawDiag(c, st, t){
  fit(c.canvas); const W=c.canvas.width, Hh=c.canvas.height, dpr=W/Math.max(1,c.canvas.getBoundingClientRect().width);
  c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,W,Hh);
  const sep=Math.round(5*dpr), hh=(Hh-sep)/2, k=Math.min(W/140, hh/50);
  // skrog set oppefra (som i originalen): spids bov til venstre, butt agterspejl til højre
  const hull=(cy,col,deck,own)=>{
    c.fillStyle='rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(85,cy+2,32,7,0,0,7); c.fill();
    const p=new Path2D(`M50 ${cy} C62 ${cy-9} 96 ${cy-9} 114 ${cy-5.5} L114 ${cy+5.5} C96 ${cy+9} 62 ${cy+9} 50 ${cy} Z`);
    c.fillStyle=col; c.fill(p); c.strokeStyle='rgba(0,0,0,.55)'; c.lineWidth=.7; c.stroke(p);
    const d=new Path2D(`M56 ${cy} C66 ${cy-6} 94 ${cy-6} 111 ${cy-3.6} L111 ${cy+3.6} C94 ${cy+6} 66 ${cy+6} 56 ${cy} Z`);
    c.fillStyle=deck; c.fill(d); c.save(); c.clip(d); c.strokeStyle='rgba(0,0,0,.18)'; c.lineWidth=.3; c.beginPath(); for(let y=cy-6;y<cy+6;y+=1.4){ c.moveTo(50,y); c.lineTo(114,y); } c.stroke(); c.restore();
    c.strokeStyle='#3a2716'; c.lineWidth=1.2; c.beginPath(); c.moveTo(50,cy); c.lineTo(40,cy-1.5); c.stroke();          // bovspryd
    for(const mx of [68,83,98]){ c.strokeStyle='rgba(0,0,0,.6)'; c.lineWidth=.9; c.beginPath(); c.moveTo(mx-1.5,cy-11); c.lineTo(mx+1.5,cy+11); c.stroke();   // rå
      c.fillStyle='rgba(245,238,220,.92)'; c.beginPath(); c.moveTo(mx-1.5,cy-11); c.quadraticCurveTo(mx+3.5,cy,mx+1.5,cy+11); c.lineTo(mx+.4,cy+11); c.quadraticCurveTo(mx+1.6,cy,mx-2.6,cy-11); c.fill();
      c.fillStyle='#2a1a0e'; c.beginPath(); c.arc(mx,cy,1.3,0,7); c.fill(); }
    if(own){ c.fillStyle='#c8102e'; c.fillRect(115,cy-2,6,4); c.fillStyle='#fff'; c.fillRect(116.7,cy-2,.7,4); c.fillRect(115,cy-.35,6,.7); }
  };
  const half=(top,wy0,draw)=>{
    c.save(); c.beginPath(); c.rect(0,top,W,hh); c.clip();
    const g=c.createLinearGradient(0,top,0,top+hh); g.addColorStop(0,'#13354b'); g.addColorStop(1,'#1d4d68'); c.fillStyle=g; c.fillRect(0,top,W,hh);
    c.setTransform(k,0,0,k,(W-140*k)/2-10*k, top+(hh-50*k)/2-wy0*k);
    draw(); c.restore();
  };
  const label=(txt,top)=>{ c.setTransform(1,0,0,1,0,0); c.fillStyle='#9fb2c0'; c.font=`700 ${Math.round(10*dpr)}px Alegreya Sans, sans-serif`; c.textAlign='left'; c.textBaseline='top'; c.fillText(txt.toUpperCase(),8*dpr,top+6*dpr); };
  // øverst: fjenden og dit nedslag (eller flaget, GOSUB 1990)
  half(0,10,()=>{

    else { hull(38,'#4a2f1e','#8a6a48',false); if(st.plask){ const [px,py]=st.plask; plaskIcon(c,px+4,py+4,'#fff'); } }
  });
  if(!st.flag) label('Fjende',0);
  c.setTransform(1,0,0,1,0,0); c.fillStyle='#0c2233'; c.fillRect(0,hh,W,sep); c.fillStyle='#d6aa54'; c.fillRect(0,hh,W,Math.max(1,dpr));
  // nederst: dit skib og fjendens nedslag
  half(hh+sep,56,()=>{ hull(79,'#24485e','#7d9aa8',true); for(const [x,y] of (st.ick||[])) plaskIcon(c,x+4,y+4,'#ffb3a8'); });
  label('Egen',hh+sep);
}

/* indsejlingen: skibe på reden, mole med havneindløb, vindstød. Kollision afgøres som POINT(ISX+5,26) i originalen. */
async function approach(IVIND, AV){
  const A = {ships:new Set(), rot:{}, k:0, sd:0, ISX:150, xd:150, IVIND, AV, gustAt:-1e9, hitAt:-1e9, gustX:160, started:false, helm:0};
  for(let i=S.IDIF*5;i>=0;i--){ const gx=fl(1+rnd()*29), gy=fl(1+rnd()*14), key=gx+','+gy;
    if(A.ships.has(key)) A.ships.delete(key); else { A.ships.add(key); A.rot[key]=(rnd()-.5)*0.5+(rnd()<.5?0:Math.PI); } }   // PUT ... XOR
  const len = 9-fl(S.IDIF/2), IB = (12-(S.IDIF/2)) + fl(1+rnd()*(6+S.IDIF));
  A.gx0 = (IB-1)*8; A.gx1 = (IB-1+len)*8-1;
  setScene('approach',{ap:A}); setHud(null);
  card(`<div class="eyebrow">Indsejling</div>`
    + `<div class="windwarn ${IVIND===1?'fromR':'fromL'}"><span class="wa">${AV}</span><div><b>Vindstød fra ${VIND[IVIND]}</b><br><span>Skubber dit skib mod ${IVIND===1?'venstre':'højre'}</span></div><span class="wa">${AV}</span></div><div class="gap"></div>`
    + P(['Styr uden om skibene på reden og ram havneindløbet.']));
  ctl(`<div class="lr"><button class="btn" data-key="4">${ARROW(-90)}Venstre</button><button class="btn" data-key="6">Højre${ARROW(90)}</button></div><p class="hint">Du kan også trykke eller swipe i venstre eller højre side af billedet.</p>`,'lr');
  const probe = (ISX, s) => {
    const x = ISX+5, y = 26+s;
    if(y>=166 && y<=170 && x>=7 && x<=313 && !(x>=A.gx0 && x<=A.gx1)) return 3;
    for(const key of A.ships){ const [gx,gy]=key.split(',').map(Number); const rx=x-gx*10, ry=y-gy*10; if(rx===5 && ry>=6 && ry<=8) return 2; }
    return 0;
  };
  const collide = async (IP, I) => {
    if(IP!==3 || I<18){ S.IREP -= 15*S.IDIF; A.hitAt=now(); V.shakeAt=now(); toast('Skade på skibet!'); chk5000(); sfx.crash(); return; }
    A.hitAt=now(); V.shakeAt=now(); await sleep(500);
    throw new GameEnd(['Dit skib gik ned med mand og mus'], 'harbor');
  };
  clearKeys();
  let A_ = await waitKey(); A.started = true;
  const stepMs = 250 - (S.IDIF-2)*3;
  let ISX = 150, ISSX = 150;
  for(let I=1;I<=18;I++){
    A.helm = A_==='4' ? 1 : A_==='6' ? -1 : 0;
    await sleep(stepMs);
    if(A_==='4'){ ISSX=ISX-10; if(ISSX<30) ISSX=30; }
    if(A_==='6'){ ISSX=ISX+10; if(ISSX>280) ISSX=280; }
    if(!(rnd() > S.IDIF/18)){
      A.gustAt=now(); A.gustX=fl(ISSX/8)*8+12; sfx.gust();
      ISSX = ISX+((IVIND-2)*10); ISX=ISSX; A.ISX=ISX;
      const ip = probe(ISX, 8*(I-1)); if(ip) await collide(ip, I);
    }
    ISX = ISSX; A.ISX = ISX; A.k = I;
    const ip = probe(ISX, 8*I); if(ip) await collide(ip, I);
    A_ = inkey(); clearKeys();
    if(A_) A.helm = A_==='4' ? 1 : A_==='6' ? -1 : 0;
  }
  A.helm=0; await sleep(350);
}

  S.IELEVA=0; S.ISIDE=0; S.IVINDS=10*(fl(3*rnd())-1); S.IVINDL=10*(fl(3*rnd())-1);
