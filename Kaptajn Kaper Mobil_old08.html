  CB = {flag: S.IDIF>4 ? (S.IIF===8?'jolly':'jack') : null, flagY:18, plask:null, ick:[]};
  if(CB.flag==='jack') CB.flag='uk';
  S.IBIGL=1;
  setScene('combat',{enemy:S.IIF, cross:true}); showCombatPanel();
  card('');
  for(;;){
    V.cross=true;
    clearKeys();
    ctlEl.classList.remove('busy');
    if(ctlMode!=='aim') ctl(`<div class="aimrow"><div class="touchhint">${ARROW(0)}<p><b>Træk sigtet</b> med fingeren på billedet.</p></div>
      <button class="btn primary fire" data-key="f">Fyr!</button></div>
      <button class="btn" data-key="0">Afbryd kampen</button>`,'aim');
    const a = (await waitKey()).toLowerCase();
    if(CB) CB.plask=null;
    if(a.startsWith('aim:')){ const [sx,sy]=a.slice(4).split(',').map(Number); S.ISIDE=sx; S.IELEVA=sy; }
    if(a==='2'){ S.IELEVA++; } else if(a==='1'){ S.IELEVA++; S.ISIDE--; } else if(a==='3'){ S.IELEVA++; S.ISIDE++; }
    else if(a==='7'){ S.IELEVA--; S.ISIDE--; } else if(a==='9'){ S.IELEVA--; S.ISIDE++; }
    else if(a==='8'){ S.IELEVA--; } else if(a==='4'){ S.ISIDE--; } else if(a==='6'){ S.ISIDE++; }
    if(S.IELEVA>30) S.IELEVA=30; if(S.IELEVA<-30) S.IELEVA=-30; if(S.ISIDE<-50) S.ISIDE=-50; if(S.ISIDE>50) S.ISIDE=50;
    if(a==='0'){ S.IAFST=500+fl(rnd()*500); CB=null; return 'abort'; }
    if(a!=='f'){ S.IMOVE=1; continue; }
    // FYR
    V.cross=false; ctlEl.classList.add('busy'); ctlMode='busy';   // knapperne bliver stående, men er låst under skuddet
    sfx.cannon(); V.fireAt=now(); V.shakeAt=now();
    for(let i=0;i<6;i++) fx('smoke',150+Math.random()*160,96+Math.random()*6,1600,{r:7,vy:14,a:.5});
    await sleep(650);
    const res = await shot2600();
    if(res==='surrender'){ fx('burst',232,56,700); await sleep(600); await surrender(); return 'done'; }
    if(res==='sink'){ fx('burst',232,56,700); await sleep(500); await sinkShip(); return 'done'; }
    // vis nedslaget (2300-2320)
    if(S.ISHOW===1){
      const x=S.IAKTX+7, y=S.IAKTY+6;
      if(S.IAKTY===50){ fx('burst',x,y,800); fx('smoke',x,y,1600,{r:4,vy:12,a:.6,col:'90,85,80'}); }
      else { fx('spout',x,y,600,{h:14}); setTimeout(()=>fx('ripple',x,y,900),350); }
    }
    if(S.IDIF<5) CB.plask=[S.IXPL,S.IYPL];
    await sleep(250);   // resultatet bliver stående i Nedslag til næste tryk — ingen 'Tryk på en tast'
  }
}
async function shot2600(){
  const IR=S.IREP, IM=S.MAND, IK=S.ISKYTS;
  const f=(S.IKAMP+S.ILOSE)/S.IKAMP;
  if(rnd()>.4){ S.IREP = S.IREP - fl((S.IAKTSKYTS/1.3)*f) - fl(S.IDIF*rnd()*.5); chk5000(); }
  if(rnd()>.4){ S.MAND = S.MAND - fl((S.IAKTSKYTS/1.4)*f) - fl(S.IDIF*rnd()*.5); chk5000(); }
  if((100*rnd()) < (S.IDIF+(S.IAKTSKYTS/5))){ S.ISKYTS--; if(S.ISKYTS<1) S.ISKYTS=1; }
  S.ISHOW=1;
  S.IRET = fl(S.ISTYRKE*S.IVINDS*.1) + fl((S.IVINDS*.2*rnd())-(.2*S.ISIDE)); S.IYPL=35;
  if(!(IR===S.IREP && IM===S.MAND && IK===S.ISKYTS)){
    let IC=(S.ISKYTS-IK)+fl((IR-S.IREP)+(IM-S.MAND)); if(IC>10) IC=10; if(IC>S.IAKTSKYTS) IC=S.IAKTSKYTS;
    for(let i=0;i<3;i++) fx('flash',200+i*12,60,180,{w:6,h:6,a:.9});
    fx('smoke',225,64,1500,{r:5,vy:8,a:.45});
    for(let ICC=1;ICC<=IC;ICC++){ CB.ick.push([20+fl(rnd()*110), 70+fl(rnd()*20)]); sfx.enemyHit(); await sleep(S.LYD?70:30); }
    await sleep(380); CB.ick=[];
  }
  S.IAFV = S.IAFST - (700+(S.ISTYRKE*S.IVINDL)-(10*S.IELEVA)+fl(50*rnd())-fl(50*rnd()));
  if(S.IAFV>0) S.IYPL=49; else if(S.IAFV<-49) S.IYPL=20;
  if(S.IRET>20) S.IRET=20; if(S.IRET<-20) S.IRET=-20;
  let IGRP=2; if(S.IDIF>4) IGRP=1; if(S.IDIF>6) IGRP=0;
  if(S.IRET>IGRP || S.IRET<-IGRP){
    S.IAKTY=60; if(S.IRET>IGRP){ S.IAKTX=195-2*S.IRET; S.IXPL=33; } else { S.IAKTX=245-2*S.IRET; S.IXPL=130; }
    return 'normal';
  }
  S.IXPL=80; S.IAKTX=225; S.IAKTY=70;
  if(S.IAFV>0) return 'normal';
  if(S.IAFV<-50){ S.ISHOW=0; return 'normal'; }
  S.IAKTY=50;
  const IAREP = S.IAKTREP - fl((2*S.ISKYTS)/S.IDIF) + S.IAFV; if(S.IAKTREP>IAREP) S.IAKTREP=IAREP;
  S.IAKTSKYTS = S.IAKTSKYTS - fl(rnd()*10/S.IDIF); if(S.IAKTSKYTS<1) return 'surrender';
  if(S.IAKTREP<15) return 'sink';
  if(S.IAKTREP<40-S.IDIF) return 'surrender';
  const IAMAND = S.IAKTMAND - fl(.9*S.IAKTMAND*(S.ISKYTS+(S.IAFV/5)+(10*rnd()))/100);
  if(IAMAND<S.IAKTMAND){ S.IAKTMAND=IAMAND; if(S.IAKTMAND<20) return 'surrender'; }
  return 'normal';
}

    rs(1,'cls',T=>{ if(prevRS) prevRS.draw(T); else { rPut('IBIG',185,10); rPut('IBIGD',175,20,'XOR'); rStatus(true); } R_OPTS=[];

  S.IRGSD += S.IAKTRGSD; S.IPOINT += fl(S.IAKTRGSD/10);
  const L=[`Der er <span class="num">${S.IAKTRGSD}</span> rigsdaler ombord.`, S.IAKTMAND>1 ? `Der er <span class="num">${S.IAKTMAND}</span> overlevende.` : 'Det flyder med lig på dækket.'];

  L.push(`Der er <span class="num">${S.IAKTKORN}</span> sække korn ombord. Dem tager du!`);
  S.KORN += S.IAKTKORN; if(S.IAKTMAND<0) S.IAKTMAND=0;

  setHud('map');
  card(`<h2>De overgiver sig!!</h2>`+P(L));
  const L3000 = (()=>{ const r=S.IAKTRGSD, m=S.IAKTMAND, k=S.IAKTKORN, mand=S.MAND; return T=>{ T.pr('De overgiver sig!!'); T.pr('Der er '+bn(r)+' rigsdaler ombord.'); T.pr(m>1?'Der er '+bn(m)+' overlevende.':'Det flyder med lig på dækket.');
    T.pr('Der er '+bn(k)+' sække korn ombord.'); T.pr('Dem tager du!'); T.pr(''); T.pr('Dette skib behøver et prisemandskab'); T.pr('på '+bn(IAKTPRI)+' mand!'); T.pr('Du har'+bn(mand)+'mand.'); }; })();
  rs(1,'cls',T=>{ L3000(T); T.pr('Vil du sænke det, (s)',true,'s'); T.pr('eller tage det som prise (p) ?',true,'p'); });
  const a = await choose([{k:'s',label:'Sænke det'},{k:'p',label:'Tage som prise',cls:'gold'}]);
  if(a==='s'){ S.MAND += S.IAKTMAND; V.sink=now(); setScene('combat',{enemy:S.IIF,sink:now(),struck:true}); await sleep(1800); return after3080(); }
  S.MAND -= IAKTPRI; chk5000();
  if(S.IDIF < fl(rnd()*16)){ S.MANDPRISE += IAKTPRI; S.IRGSDPRI += S.IAKTRGSD; }
  setScene('combat',{enemy:S.IIF,sail:now(),prizeFlag:'dk'});   // prisen sejler mod København under dansk flag
  LOG = `Du tog ${esc(foeName().toLowerCase())} som prise (${S.IPOINT-ENC0.p} point og ${S.IRGSD-ENC0.r} rigsdaler) og sendte den mod København. Når du selv anløber København, venter prisemandskabet og prisepengene på dig – hvis prisen når frem.`;

  await pressKey();
}

  CB=null;
  for(;;){
    play('MBT200L16O3CEGO4C..O3GO4C4');
    if((S.IBIGL===1 || RETRO.on) && S.IBOARD===0){   // retro: skibet glider altid op første gang (kun grafik)

  { const orig = KF===2 ? ['Du finder en øde ø ','med en skattekiste,','der indeholder '+bn(fl(300*KF))+'rigsdaler!']

    rs(0,'mapclear',T=>{ orig.forEach(l=>T.pr(l)); T.pr(''); T.pr(''); T.any(); }); }
